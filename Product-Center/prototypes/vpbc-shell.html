<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vp-green: #20A06E;
      --vp-green-dark: #178A5C;
      --vp-green-light: #E8F5EE;
      --vp-lime: #BDD646;
      --vp-red: #B23A48;
      --vp-mint-50: #F2F8F4;
      --vp-white: #FFFFFF;
      --vp-gray-900: #1A1A1A;
      --vp-gray-700: #4A4A4A;
      --vp-gray-500: #737373;
      --vp-gray-300: #D1D5DB;
      --vp-gray-100: #F3F4F6;
      --vp-border: #E5E7EB;
      --sidebar-width: 220px;
      --topbar-height: 52px;
      --tabbar-height: 38px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--vp-mint-50);
      color: var(--vp-gray-900);
      font-size: 14px;
      height: 100vh;
      display: flex;
    }

    /* ── Left Sidebar ── */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--vp-white);
      border-right: 1px solid var(--vp-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-logo {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid var(--vp-border);
    }

    .sidebar-logo-mark {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, var(--vp-green) 0%, var(--vp-lime) 100%);
      border-radius: 5px;
      margin-right: 10px;
    }

    .sidebar-logo-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--vp-gray-900);
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .menu-group { margin-bottom: 4px; }

    .menu-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--vp-gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 5px;
      font-size: 13px;
      color: var(--vp-gray-700);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .menu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }

    .menu-item.active {
      background: var(--vp-green-light);
      color: var(--vp-green);
      font-weight: 600;
    }

    .menu-item .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .menu-item .arrow {
      margin-left: auto;
      font-size: 11px;
      color: var(--vp-gray-400);
      transition: transform 0.2s;
    }

    .menu-item.open .arrow { transform: rotate(180deg); }

    /* Sub menu — slides down */
    .submenu {
      display: none;
      padding-left: 32px;
    }

    .submenu.open { display: block; }

    .submenu-item {
      padding: 7px 12px;
      font-size: 13px;
      color: var(--vp-gray-600);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .submenu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }
    .submenu-item.has-tab { color: var(--vp-green); font-weight: 600; }

    /* ── Main Area ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* ── Topbar ── */
    .topbar {
      height: var(--topbar-height);
      background-color: var(--vp-white);
      border-bottom: 1px solid var(--vp-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar-breadcrumb {
      font-size: 13px;
      color: var(--vp-gray-500);
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--vp-gray-600);
      font-size: 13px;
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--vp-green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    /* ── Tab Bar ── */
    .tabbar {
      background-color: var(--vp-white);
      border-bottom: 1px solid var(--vp-border);
      display: flex;
      align-items: stretch;
      height: var(--tabbar-height);
      padding: 0 16px;
      gap: 2px;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 13px;
      color: var(--vp-gray-500);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s;
      user-select: none;
    }

    .tab:hover { color: var(--vp-gray-700); }
    .tab.active { color: var(--vp-green); border-bottom-color: var(--vp-green); font-weight: 600; }

    .tab-close {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      color: var(--vp-gray-400);
      font-size: 14px;
      line-height: 1;
    }

    .tab-close:hover { background: var(--vp-gray-100); color: var(--vp-gray-700); }

    /* ── Content Area ── */
    .content { flex: 1; overflow: auto; padding: 24px; }

    .placeholder-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--vp-gray-400);
      gap: 12px;
    }

  </style>
</head>

<script>
  const openTabs = {};
  let activeTabKey = null;

  function openTab(key, title) {
    if (openTabs[key]) {
      activateTab(key);
      return;
    }
    openTabs[key] = { title, content: buildContent(key) };
    renderTabBar();
    activateTab(key);
  }

  function closeTab(key, event) {
    event.stopPropagation();
    delete openTabs[key];
    renderTabBar();
    if (activeTabKey === key) {
      const keys = Object.keys(openTabs);
      activeTabKey = keys.length > 0 ? keys[keys.length - 1] : null;
      if (activeTabKey) activateTab(activeTabKey);
      else { renderContent(''); updateBreadcrumb(''); }
    }
  }

  function activateTab(key) {
    activeTabKey = key;
    renderTabBar();
    renderContent(openTabs[key].content);
    updateBreadcrumb(openTabs[key].title);
  }

  function renderTabBar() {
    const bar = document.getElementById('tabbar');
    bar.innerHTML = Object.keys(openTabs).map(key => {
      const isActive = key === activeTabKey;
      return `<div class="tab ${isActive ? 'active' : ''}" onclick="activateTab('${key}')">
        ${openTabs[key].title}
        <span class="tab-close" onclick="closeTab('${key}', event)">×</span>
      </div>`;
    }).join('');
  }

  function renderContent(html) {
    document.getElementById('content').innerHTML = html;
  }

  function updateBreadcrumb(text) {
    document.getElementById('topbarBreadcrumb').textContent = text;
  }

  function toggleSubmenu(id) {
    const sub = document.getElementById('submenu-' + id);
    const item = document.getElementById('menu-' + id);
    const isOpen = sub.classList.contains('open');
    sub.classList.toggle('open', !isOpen);
    item.classList.toggle('open', !isOpen);
  }
