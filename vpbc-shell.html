function idxRenderDashChart(tasks) {
  const svg = document.getElementById("idxDashChart");
  if (!svg) return;
  const n = IDX_NAV_DATES.length, s = idxRangeStart();
  const W = 760, H = 260, PL = 52, PR = 118, PT = 14, PB = 24, iw = W - PL - PR, ih = H - PT - PB;
  const X = i => PL + iw * (i - s) / Math.max(1, n - 1 - s);
  const code = idxDashIndex;
  const bmArr = IDX_NAV_BM[code];
  const S = [];
  if (bmArr) S.push({ name: "指数基准", color: "#6B7A73", dash: "6 4", w: 2, isBm: true,
    pts: bmArr.slice(s).map((v, k) => ({ i: s + k, r: (v / bmArr[s] - 1) * 100 })),
    rawAt: i => IDX_NAV_BM[code][i] });
  tasks.forEach((t, k) => {
    const { start, vals } = idxTaskVals(t, s);
    if (!vals.length) return;
    const base = vals[0];
    S.push({ name: t.analyst, color: IDX_SERIES_COLORS[k % IDX_SERIES_COLORS.length], dash: null, w: 2.2,
      pts: vals.map((v, k2) => ({ i: start + k2, r: (v / base - 1) * 100 })),
      rawAt: i => { const p = i - t.off; return p >= 0 && p < t.nav.length ? t.nav[p] : null; } });
  });
  let lo = 0, hi = 0;
  S.forEach(sr => sr.pts.forEach(p => { lo = Math.min(lo, p.r); hi = Math.max(hi, p.r); }));
  const pad = (hi - lo) * 0.12 || 1;
  lo -= pad; hi += pad;
  if (lo > -0.5) lo = -0.5;
  if (hi < 0.5) hi = 0.5;
  const Y = r => PT + ih * (1 - (r - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k < 5; k++) {
    const r = lo + (hi - lo) * k / 4;
    g += `<line x1="${PL}" y1="${Y(r)}" x2="${W - PR}" y2="${Y(r)}" stroke="var(--vp-gray-100)"/>` +
      `<text x="${PL - 6}" y="${Y(r) + 3}" text-anchor="end" class="axis-tick">${r >= 0 ? "+" : ""}${r.toFixed(1)}%</text>`;
  }
  if (lo < 0 && hi > 0) g += `<line x1="${PL}" y1="${Y(0)}" x2="${W - PR}" y2="${Y(0)}" stroke="var(--vp-gray-300)" stroke-dasharray="2 3"/>`;
  for (let i = s; i < n; i++) if ((i - s) % 3 === 0 || i === n - 1)
    g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" class="axis-tick">${IDX_NAV_DATES[i]}</text>`;
  const paths = S.map(sr => sr.pts.length < 2 ? "" :
    `<path d="${sr.pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + "," + Y(p.r).toFixed(1)).join("")}" fill="none" stroke="${sr.color}" stroke-width="${sr.w}" stroke-linecap="round" stroke-linejoin="round" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ""} opacity=".92"/>`).join("");
  const dots = S.filter(sr => sr.pts.length === 1).map(sr => `<circle cx="${X(sr.pts[0].i)}" cy="${Y(sr.pts[0].r)}" r="3.5" fill="${sr.color}"/>`).join("");
  // 线尾直接标注：色条承色、文字用灰墨，防 13px 内碰撞
  const ends = S.filter(sr => sr.pts.length).map(sr => ({ ...sr, er: sr.pts[sr.pts.length - 1].r, ey: Y(sr.pts[sr.pts.length - 1].r) })).sort((a, b) => a.ey - b.ey);
  for (let k = 1; k < ends.length; k++) if (ends[k].ey - ends[k - 1].ey < 13) ends[k].ey = ends[k - 1].ey + 13;
  const labels = ends.map(x => `<line x1="${W - PR + 6}" y1="${x.ey - 3.5}" x2="${W - PR + 20}" y2="${x.ey - 3.5}" stroke="${x.color}" stroke-width="3" stroke-linecap="round" ${x.dash ? 'stroke-dasharray="3 2.5"' : ""}/>` +
    `<text x="${W - PR + 25}" y="${x.ey}" font-size="11" fill="#3D4A42" style="font-variant-numeric:tabular-nums">${x.name} ${x.er >= 0 ? "+" : ""}${x.er.toFixed(1)}%</text>`).join("");
  const hdots = S.map((sr, k) => `<circle class="idxhdot" data-k="${k}" r="4" fill="${sr.color}" stroke="#fff" stroke-width="1.5" style="display:none"/>`).join("");
  svg.innerHTML = g + paths + dots + labels + hdots + `<line id="idxDashCv" y1="${PT}" y2="${H - PB}" stroke="var(--vp-gray-300)" style="display:none"/>`;
  const legend = document.getElementById("idxDashLegend");
  if (legend) legend.innerHTML = S.map(sr =>
    `<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:14px;height:3px;border-radius:2px;display:inline-block;${sr.dash ? `background:repeating-linear-gradient(90deg,${sr.color} 0 4px,transparent 4px 7px)` : `background:${sr.color}`}"></i>${sr.name}</span>`).join("");
  const tip = document.getElementById("idxDashTip");
  svg.onpointermove = e => {
    const rect = svg.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * W;
    let i = Math.round((x - PL) / iw * (n - 1 - s) + s);
    i = Math.max(s, Math.min(n - 1, i));
    const cv = svg.querySelector("#idxDashCv");
    cv.style.display = ""; cv.setAttribute("x1", X(i)); cv.setAttribute("x2", X(i));
    svg.querySelectorAll(".idxhdot").forEach(d => {
      const sr = S[+d.dataset.k];
      const p = sr.pts.find(q => q.i === i);
      if (p) { d.style.display = ""; d.setAttribute("cx", X(i)); d.setAttribute("cy", Y(p.r)); }
      else d.style.display = "none";
    });
    tip.innerHTML = `<div style="font-weight:600;color:var(--vp-gray-900);margin-bottom:4px">2026-${IDX_NAV_DATES[i]}</div>` +
      S.map(sr => {
        const p = sr.pts.find(q => q.i === i);
        if (!p) return "";
        const raw = sr.rawAt(i);
        return `<div style="display:flex;align-items:center;gap:6px;padding:1px 0">
          <i style="width:8px;height:8px;border-radius:2px;background:${sr.color};display:inline-block;flex-shrink:0"></i>
          <span style="color:var(--vp-gray-500)">${sr.name}</span>
          <b style="margin-left:auto;color:var(--vp-gray-900);font-variant-numeric:tabular-nums">${raw != null ? raw.toFixed(3) : "—"} <span style="color:${p.r >= 0 ? "var(--vp-red)" : "var(--vp-green)"}">(${p.r >= 0 ? "+" : ""}${p.r.toFixed(1)}%)</span></b>
        </div>`;
      }).join("");
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 230) + "px";
    tip.style.top = (e.clientY - 12) + "px";
  };
  svg.onpointerleave = () => {
    tip.style.display = "none";
    svg.querySelectorAll("#idxDashCv,.idxhdot").forEach(el => el.style.display = "none");
  };
}

function idxRenderDetailChart(t, bmArr) {
  const svg = document.getElementById("idxDetChart");
  if (!svg) return;
  const n = IDX_NAV_DATES.length;
  const W = 760, H = 190, PL = 48, PR = 96, PT = 12, PB = 20, iw = W - PL - PR, ih = H - PT - PB;
  const X = i => PL + iw * i / (n - 1);
  const all = [...t.nav, ...(bmArr || [])];
  let lo = Math.min(...all), hi = Math.max(...all);
  const p = (hi - lo) * 0.08 || 0.01;
  lo -= p; hi += p;
  const Y = v => PT + ih * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k < 4; k++) {
    const v = lo + (hi - lo) * k / 3;
    g += `<line x1="${PL}" y1="${Y(v)}" x2="${W - PR}" y2="${Y(v)}" stroke="var(--vp-gray-100)"/><text x="${PL - 6}" y="${Y(v) + 3}" text-anchor="end" class="axis-tick">${v.toFixed(2)}</text>`;
  }
  [0, n - 1].forEach(i => g += `<text x="${X(i)}" y="${H - 4}" text-anchor="${i ? "end" : "start"}" class="axis-tick">${IDX_NAV_DATES[i]}</text>`);
  const bmPath = bmArr ? `<path d="${bmArr.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("")}" fill="none" stroke="#6B7A73" stroke-width="2" stroke-dasharray="6 4" opacity=".9"/>` : "";
  const myPath = t.nav.length < 2 ? "" : `<path d="${t.nav.map((v, i) => (i ? "L" : "M") + X(t.off + i).toFixed(1) + "," + Y(v).toFixed(1)).join("")}" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linecap="round"/>`;
  const myEnd = t.nav[t.nav.length - 1];
  const endDot = `<circle cx="${X(t.off + t.nav.length - 1)}" cy="${Y(myEnd)}" r="3.5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/>`;
  const labels = [];
  if (bmArr) labels.push({ v: bmArr[bmArr.length - 1], c: "#6B7A73", n: "基准", dash: true });
  labels.push({ v: myEnd, c: "#2a78d6", n: t.analyst, dash: false });
  labels.sort((a, b) => a.v - b.v);
  const ly = labels.map(l => Y(l.v));
  for (let k = 1; k < ly.length; k++) if (ly[k] - ly[k - 1] < 12) ly[k] = ly[k - 1] + 12;
  const lbl = labels.map((l, k) => `<line x1="${X(n - 1) + 6}" y1="${ly[k] - 3.5}" x2="${X(n - 1) + 18}" y2="${ly[k] - 3.5}" stroke="${l.c}" stroke-width="3" stroke-linecap="round" ${l.dash ? 'stroke-dasharray="3 2.5"' : ""}/>` +
    `<text x="${X(n - 1) + 23}" y="${ly[k]}" font-size="11" fill="#3D4A42" style="font-variant-numeric:tabular-nums">${l.n} ${l.v.toFixed(3)}</text>`).join("");
  svg.innerHTML = g + bmPath + myPath + endDot + lbl;
}

function idxOpsPickAnalyst(a) { idxOpsAnalyst = a; idxOpsTaskId = null; idxOpsEditTaskId = null; idxOpsRenderAll(); }
function idxOpsPickTask(id) { idxOpsTaskId = id; idxOpsEditTaskId = null; idxOpsRenderAll(); }
// 权重输入：只更新偏离/合计单元格，避免整卡重渲染导致输入失焦
function idxOpsWt(code, val) {
  if (!idxOpsEdit) return;
  const v = parseFloat(val);
  idxOpsEdit[code] = isNaN(v) || v < 0 ? 0 : v;
  const total = Object.values(idxOpsEdit).reduce((a, b) => a + (b || 0), 0);
  const t = IDX_TASKS.find(x => x.id === idxOpsTaskId);
  const m = t ? (IDX_CONSTITUENTS[t.indexCode] || []).find(x => x.code === code) : null;
  const devEl = document.getElementById("idxDev_" + code);
  if (devEl && m) {
    const dev = idxOpsEdit[code] - m.weight;
    devEl.textContent = (dev >= 0 ? "+" : "") + dev.toFixed(1);
  }
  const totalEl = document.getElementById("idxOpsTotal");
  if (totalEl) { totalEl.textContent = total.toFixed(1) + "%"; totalEl.style.color = total > 100 ? "var(--vp-red)" : "var(--vp-gray-900)"; }
  const cashEl = document.getElementById("idxOpsCash");
  if (cashEl) cashEl.textContent = (100 - total).toFixed(1) + "%";
}
function idxOpsAdd() {
  const code = document.getElementById("idxOpsAddSel")?.value;
  const wt = parseFloat(document.getElementById("idxOpsAddWt")?.value) || 0;
  if (!code) { alert("该指数成份股已全部持有"); return; }
  idxOpsEdit[code] = wt;
  idxOpsRenderAll();
}
function idxOpsRemove(code) {
  delete idxOpsEdit[code];
  idxOpsRenderAll();
}
function idxOpsCommit() {
  const task = IDX_TASKS.find(x => x.id === idxOpsTaskId);
  if (!task || !idxOpsEdit) return;
  const total = Object.values(idxOpsEdit).reduce((a, b) => a + (b || 0), 0);
  if (total > 100) { alert("权重合计超过 100%，请先调整"); return; }
  const oldMap = Object.fromEntries(task.holdings.map(h => [h.code, h.wt]));
  const changes = [];
  for (const code of new Set([...Object.keys(oldMap), ...Object.keys(idxOpsEdit)])) {
    const from = oldMap[code] ?? 0, to = idxOpsEdit[code] ?? 0;
    if (Math.abs(to - from) >= 0.05) {
      const m = idxStockMeta(code);
      changes.push({ code, name: m ? m.name : code, from, to });
    }
  }
  if (!changes.length) { alert("未调整任何权重"); return; }
  const added = changes.filter(c => c.from === 0).length;
  const removed = changes.filter(c => c.to === 0).length;
  const adjusted = changes.length - added - removed;
  task.rebalances.push({ date: "2026-09-03", note: `${adjusted} 笔调整${added ? `、${added} 笔新建仓` : ""}${removed ? `、${removed} 笔清仓` : ""}`, changes });
  task.holdings = Object.entries(idxOpsEdit).filter(([, w]) => w > 0)
    .map(([code, wt]) => { const m = idxStockMeta(code); return { code, name: m ? m.name : code, wt }; })
    .sort((a, b) => b.wt - a.wt);
  idxOpsEditTaskId = null; // 从最新持仓重新初始化编辑缓冲
  idxOpsRenderAll();
  idxToast(`调仓已提交：${changes.length} 笔变更已记录（原型不重算净值）`);
}

function idxSyncBuildSeg() {
  document.querySelectorAll("#idxBuildSeg .seg").forEach(b => b.classList.remove("active"));

function idxRenderBuildSummary() {
  const data = IDX_CONSTITUENTS[idxCurIndex] || [];

  const prefix = document.getElementById("idxPortName").value.trim();

  if (analysts.length === 0) { alert("请选择研究员"); return; }
  const idx = idxFindIndex(idxCurIndex);

  const data = IDX_CONSTITUENTS[idxCurIndex] || [];
  const stocks = idxBuildMode === 'top20' ? [...data].sort((a, b) => b.weight - a.weight).slice(0, 20)
    : idxBuildMode === 'custom' ? data.filter(s => idxSelected.has(s.code))
    : data;
  if (!stocks.length) { alert("当前建仓方式下没有成份股，请调整后重试"); return; }
  const base = IDX_TASKS.length;
  analysts.forEach((a, i) => {

      indexCode: idxCurIndex,
      analyst: a,

      rebalances: [],

  idxSwitchTab("portfolios");

}

function portSwitchTab(tab) {
  document.querySelectorAll("#portMainTab .seg").forEach(b => b.classList.remove("active"));
  document.querySelector(`#portMainTab .seg[onclick="portSwitchTab('${tab}')"]`).classList.add("active");
  document.getElementById("portPaneMine").style.display = tab === "mine" ? "" : "none";
  document.getElementById("portPaneShared").style.display = tab === "shared" ? "" : "none";
  if (tab === "shared") portRenderShared();
}

function portOpenCreate() {
  document.getElementById("portCreateName").value = "";
  document.getElementById("portCreateStrategy").value = "";
  document.getElementById("portCreateBenchmark").value = "";
  document.getElementById("portCreateCapital").value = "";
  document.getElementById("portCreateNameTip").style.display = "none";
  document.getElementById("portCreateName").classList.remove("error");
  document.getElementById("portCreateModal").style.display = "flex";
}

function portCloseCreate() {
  document.getElementById("portCreateModal").style.display = "none";
}

function portDoCreate() {
  const name = document.getElementById("portCreateName").value.trim();
  const benchmark = document.getElementById("portCreateBenchmark").value.trim();
  const capital = document.getElementById("portCreateCapital").value.trim();
  const nameInput = document.getElementById("portCreateName");
  const nameTip = document.getElementById("portCreateNameTip");
  // 校验组合名称不能重复
  if (PORTFOLIOS.some(p => p.name === name)) {
    nameInput.classList.add("error");
    nameTip.style.display = "";
    return;
  }
  // 必填校验
  if (!name) { nameInput.classList.add("error"); return; }
  if (!benchmark) { document.getElementById("portCreateBenchmark").classList.add("error"); return; }
  if (!capital) { document.getElementById("portCreateCapital").classList.add("error"); return; }
  // 创建新组合
  const newId = "P" + String(PORTFOLIOS.length + 1).padStart(3, "0");
  PORTFOLIOS.unshift({ id: newId, name, holdings:0, weight:"—", capital, creator:"当前用户", share:"私人", shareType:"—", status:"启用", created: (d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`)(new Date()), _strategy: document.getElementById("portCreateStrategy").value.trim(), _benchmark: benchmark });
  portCloseCreate();
  portRenderPortfolios();
}


// ========== Init ==========
document.addEventListener('DOMContentLoaded', function() {
  window.addEventListener('hashchange', onHashChange);
  const hash = location.hash.slice(1);
  if (hash && hash !== 'industry') {
    openTabByHash(hash);
  } else {
    openTab('industry', '行业配置');
  }
});

function openTabByHash(key) {
  const TITLE_MAP = {
    'product-management': '产品管理',
    'product-add': '新增产品',
    'product-detail': '产品详情',
    'share-class': '份额信息',
    'share-class-add': '新增份额',
    'research-share': '研报共享',
    'industry': '行业配置',
    'research-report': '研究报告',
    'stock-pool': '股票池',
    'portfolio': '模拟组合',
    'index-sim': '指数模拟',
    'config': '系统配置',
    'fee': '费率结构',
  };
  const title = TITLE_MAP[key] || key;
  openTab(key, title);
}

function onHashChange() {
  const hash = location.hash.slice(1);
  if (!hash) {
    if (activeTabKey) closeTab(activeTabKey, { stopPropagation: function() {} });
    return;
  }
  if (hash !== activeTabKey) {
    if (openTabs[hash]) activateTab(hash);
    else openTabByHash(hash);
  }
}
