<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vp-green: #20A06E;
      --vp-green-dark: #178A5C;
      --vp-green-light: #E8F5EE;
      --vp-lime: #BDD646;
      --vp-red: #B23A48;
      --vp-mint-50: #F2F8F4;
      --vp-white: #FFFFFF;
      --vp-gray-900: #1A1A1A;
      --vp-gray-700: #4A4A4A;
      --vp-gray-500: #737373;
      --vp-gray-300: #D1D5DB;
      --vp-gray-100: #F3F4F6;
      --vp-border: #E5E7EB;
      --vp-shadow: 0 1px 3px rgba(16, 94, 62, 0.08);
      --vp-radius: 6px;
      --vp-radius-sm: 4px;
      --sidebar-width: 220px;
      --topbar-height: 52px;
      --tabbar-height: 38px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--vp-mint-50);
      color: var(--vp-gray-900);
      font-size: 14px;
      height: 100vh;
      display: flex;
    }

    .sidebar { width: var(--sidebar-width); background-color: var(--vp-white); border-right: 1px solid var(--vp-border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-logo { height: var(--topbar-height); display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--vp-border); }
    .sidebar-logo-mark { width: 26px; height: 26px; background: linear-gradient(135deg, var(--vp-green) 0%, var(--vp-lime) 100%); border-radius: 5px; margin-right: 10px; }
    .sidebar-logo-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--vp-gray-900); }
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .menu-group { margin-bottom: 4px; }
    .menu-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 5px; font-size: 13px; color: var(--vp-gray-700); cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; }
    .menu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }
    .menu-item.active { background: var(--vp-green-light); color: var(--vp-green); font-weight: 600; }
    .menu-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .menu-item .arrow { margin-left: auto; font-size: 11px; color: var(--vp-gray-400); transition: transform 0.2s; }
    .menu-item.open .arrow { transform: rotate(180deg); }
    .submenu { padding-left: 32px; }
    .submenu-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px; color: var(--vp-gray-600); border-radius: 4px; cursor: pointer; transition: background 0.1s, color 0.1s; }
    .submenu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }
    .submenu-item.active { background: var(--vp-green-light); color: var(--vp-green); font-weight: 600; }
    .submenu-item .icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: var(--topbar-height); background-color: var(--vp-white); border-bottom: 1px solid var(--vp-border); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
    .topbar-breadcrumb { font-size: 13px; color: var(--vp-gray-500); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .user-chip { display: flex; align-items: center; gap: 8px; color: var(--vp-gray-600); font-size: 13px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--vp-green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .tabbar { background-color: var(--vp-white); border-bottom: 1px solid var(--vp-border); display: flex; align-items: stretch; height: var(--tabbar-height); padding: 0 16px; gap: 2px; flex-shrink: 0; overflow-x: auto; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--vp-gray-500); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s; user-select: none; }
    .tab:hover { color: var(--vp-gray-700); }
    .tab.active { color: var(--vp-green); border-bottom-color: var(--vp-green); font-weight: 600; }
    .tab-close { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: var(--vp-gray-400); font-size: 14px; line-height: 1; }
    .tab-close:hover { background: var(--vp-gray-100); color: var(--vp-gray-700); }
    .content { flex: 1; overflow: auto; padding: 24px; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title { font-size: 24px; font-weight: 600; color: var(--vp-gray-900); }
    .page-subtitle { font-size: 13px; color: var(--vp-gray-500); margin-top: 2px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--vp-radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s ease; font-family: inherit; }
    .btn-primary { background-color: var(--vp-green); color: var(--vp-white); }
    .btn-primary:hover { background-color: var(--vp-green-dark); }
    .btn-secondary { background-color: var(--vp-white); color: var(--vp-gray-700); border: 1px solid var(--vp-border); }
    .btn-secondary:hover { border-color: var(--vp-green); color: var(--vp-green); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-ghost { background: transparent; color: var(--vp-gray); }
    .btn-ghost:hover { background: var(--vp-gray-100); }

    .card { background-color: var(--vp-white); border-radius: var(--vp-radius); box-shadow: var(--vp-shadow); border: 1px solid var(--vp-border); margin-bottom: 20px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--vp-border); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--vp-gray-900); }
    .card-body { padding: 16px; }

    .filter-bar { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--vp-gray-700); }
    .form-control { height: 34px; padding: 0 12px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background-color: var(--vp-white); min-width: 140px; font-family: inherit; }
    .form-control:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }
    .filter-actions { display: flex; gap: 8px; margin-left: auto; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--vp-border); }
    .data-table thead th { background-color: var(--vp-gray-100); color: var(--vp-gray-700); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--vp-border); border-right: 1px solid var(--vp-border); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .data-table thead th:last-child { border-right: none; }
    .data-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--vp-border); border-right: 1px solid var(--vp-border); color: var(--vp-gray-900); vertical-align: middle; }
    .data-table tbody td:last-child { border-right: none; }
    .data-table tbody tr:hover { background-color: var(--vp-mint-50); }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .cell-code { font-family: 'SF Mono', Consolas, monospace; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--vp-green); }
    .cell-name { font-weight: 500; }
    .cell-muted { color: var(--vp-gray-500); }

    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .tag-green { background-color: var(--vp-green-light); color: var(--vp-green); }
    .tag-red { background-color: #FCE8EA; color: var(--vp-red); }
    .tag-gray { background-color: var(--vp-gray-100); color: var(--vp-gray-500); }
    .tag-blue { background-color: #E6F2FF; color: #2563EB; }

    .segmented { display: inline-flex; background: var(--vp-gray-100); border-radius: var(--vp-radius); padding: 3px; gap: 2px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--vp-green); }
    .sort-icon { font-size: 11px; margin-left: 2px; }
    .seg { font-size: 12px; font-weight: 600; padding: 5px 12px; border: none; background: transparent; color: var(--vp-gray-700); border-radius: 4px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .seg:hover { color: var(--vp-green); }
    .seg.active { background: var(--vp-white); color: var(--vp-green); box-shadow: var(--vp-shadow); }

    .pagination-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--vp-border); }
    .pagination-info { font-size: 13px; color: var(--vp-gray-500); }
    .pagination { display: flex; gap: 4px; }
    .page-btn { min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--vp-border); background-color: var(--vp-white); color: var(--vp-gray-700); border-radius: var(--vp-radius-sm); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
    .page-btn:hover { border-color: var(--vp-green); color: var(--vp-green); }
    .page-btn.active { background-color: var(--vp-green); border-color: var(--vp-green); color: var(--vp-white); font-weight: 600; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .notice { background: var(--vp-gray-100); border: 1px solid var(--vp-border); border-radius: var(--vp-radius); padding: 10px 14px; font-size: 13px; color: var(--vp-gray-700); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .notice .ico { color: var(--vp-green); }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .muted { color: var(--vp-gray-500); }
    .tiny { font-size: 12px; color: var(--vp-gray-500); }
    .bold { font-weight: 600; }
    .right { text-align: right; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mt-4 { margin-top: 16px; }

    .chip-stack { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
    .ind-cell { white-space: nowrap; display: inline-block; }
    .industry-table-wrap { max-height: 320px; overflow-y: auto; }
    .import-record-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .import-record-actions { display: flex; align-items: center; gap: 8px; }
    .empty-state { padding: 16px; text-align: center; color: var(--vp-gray-500); background: var(--vp-gray-100); border-radius: var(--vp-radius); border: 1px dashed var(--vp-border); }

    /* Report modal */
    .modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    .modal-panel { position: relative; background: #fff; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--vp-border); }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--vp-gray-900); }
    .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--vp-border); }
    .form-row { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--vp-gray-700); margin-bottom: 6px; }
    .form-label.required::after { content: " *"; color: var(--vp-red); }
    .textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius); font-size: 14px; font-family: inherit; resize: vertical; }
    .textarea:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px rgba(32,160,110,0.1); }
    .stock-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--vp-mint-50); border: 1px solid var(--vp-border); border-radius: 6px; font-size: 13px; color: var(--vp-gray-900); }
    .filter-select { width: auto; flex: 0 1 auto; }
    .input { height: 34px; padding: 0 10px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background: var(--vp-white); font-family: inherit; }
    .input:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }
    .select { height: 34px; padding: 0 10px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background: var(--vp-white); font-family: inherit; }
    .select:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }

    /* Stock pool */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .kpi { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--vp-white); border: 1px solid var(--vp-border); border-radius: var(--vp-radius); }
    .kpi-icon { font-size: 24px; }
    .kpi-num { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 600; line-height: 1; }
    .kpi-label { font-size: 14px; color: var(--vp-gray-500); margin-top: 2px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card-pad { padding: 20px; }
    .card-hover { transition: border-color .15s, box-shadow .15s; cursor: pointer; }
    .card-hover:hover { border-color: var(--vp-green); box-shadow: var(--vp-shadow-md); }
    .tag-gold { background: rgba(199,162,82,0.15); color: #C7A252; }
    .tag-up { color: var(--vp-red); font-weight: 700; }
    .tag-down { color: var(--vp-green); font-weight: 700; }

    /* Portfolio */
    .weight-bar { width: 60px; height: 6px; background: var(--vp-gray-100); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .weight-fill { height: 100%; background: var(--vp-green); border-radius: 3px; }
    .list-scroll { max-height: 300px; overflow-y: auto; }
    .list-scroll::-webkit-scrollbar { width: 6px; }
    .list-scroll::-webkit-scrollbar-thumb { background: var(--vp-gray-300); border-radius: 3px; }
    .inline-detail { background: var(--vp-mint-50); border: 1px solid var(--vp-border); border-radius: 12px; padding: 4px 16px 16px; margin-top: 12px; }
    .inline-detail-divider { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; padding-top: 14px; border-top: 1px solid var(--vp-border); font-size: 14px; font-weight: 700; color: var(--vp-green-dark); }
    .inline-detail-divider span { font-size: 14px; font-weight: 700; color: var(--vp-green-dark); }
    .duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
    .duo-grid .card { margin-bottom: 0; min-width: 0; display: flex; flex-direction: column; }
    .duo-grid .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .duo-scroll { overflow: auto; flex: 1; max-height: 320px; }
    .duo-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .duo-scroll::-webkit-scrollbar-thumb { background: var(--vp-gray-300); border-radius: 3px; }
    .duo-grid .card { height: 360px; }
    .row-selected td { background: var(--vp-green-light) !important; }
    /* Chart */
    .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--vp-gray-500); margin-bottom: 6px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
    .perf-pl { font-size: 12px; font-weight: 600; color: var(--vp-gray-500); margin: 0 0 4px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .perf-pl .lg { display: inline-flex; align-items: center; gap: 4px; font-weight: 400; }
    .perf-pl .lg i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
    .chart-tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--vp-green-light); border-radius: 8px; box-shadow: 0 4px 14px rgba(21,50,43,.10); padding: 8px 10px; font-size: 12px; min-width: 130px; z-index: 30; }
    .chart-tip .tip-date { color: var(--vp-gray-500); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .chart-tip div:not(.tip-date) { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .chart-tip i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; flex: none; }
    .chart-tip span { color: var(--vp-gray-500); }
    .chart-tip b { margin-left: auto; color: var(--vp-gray-900); font-variant-numeric: tabular-nums; }
    .axis-tick { font-size: 11px; fill: var(--vp-gray-500); font-variant-numeric: tabular-nums; }
    .end-label { font-size: 12px; font-weight: 700; fill: var(--vp-gray-900); font-variant-numeric: tabular-nums; }
    /* Modal */
    .modal-mask { position: fixed; inset: 0; background: rgba(10,55,38,.32); display: none; align-items: center; justify-content: center; z-index: 500; }
    .modal-mask.show { display: flex; }
    .modal-mask .modal-overlay { position: absolute; inset: 0; background: transparent; }
    .modal-mask .modal { position: static; inset: auto; display: flex; flex-direction: column; max-width: 500px; width: 100%; margin: 0 auto; box-shadow: 0 12px 40px rgba(21,50,43,.18); border-radius: 12px; background: #fff; max-height: 86vh; }
    .ind-add-modal { border: 1px solid #DCEBE2; border-radius: 14px; box-shadow: 0 16px 48px rgba(21,50,43,.14); animation: indPop .22s ease; }
    @keyframes indPop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .ms { position: relative; }
    .ms-field { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 10px; border: 1px solid var(--vp-border); border-radius: 8px; background: #fff; cursor: pointer; transition: border-color .15s; }
    .ms-field:hover { border-color: var(--vp-green); }
    .ms-tags { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
    .ms-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--vp-mint-50); border: 1px solid var(--vp-border); border-radius: 4px; padding: 2px 6px; font-size: 12px; color: var(--vp-gray-700); }
    .ms-tag b { cursor: pointer; font-weight: 400; color: var(--vp-gray-500); }
    .ms-tag b:hover { color: var(--vp-red); }
    .ms-ph { color: var(--vp-gray-400); font-size: 13px; }
    .ms-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1px solid var(--vp-border); border-radius: 8px; box-shadow: 0 8px 24px rgba(21,50,43,.12); max-height: 180px; overflow-y: auto; z-index: 20; padding: 4px 0; }
    .ms-panel.open { display: block; }
    .ms-opt { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px; color: var(--vp-gray-700); cursor: pointer; }
    .ms-opt:hover { background: var(--vp-mint-50); }
    .ms-opt input { accent-color: var(--vp-green); }
    .modal-box { background: #fff; border-radius: 12px; width: 480px; max-width: 92vw; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(21,50,43,.18); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--vp-border); }
    .modal-body { padding: 16px 18px; overflow: auto; flex: 1; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--vp-border); }
    .flex1 { flex: 1; }
    /* Indicator pick */
    .pick-list { max-height: 300px; overflow: auto; border: 1px solid var(--vp-border); border-radius: 8px; }
    .pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--vp-border); cursor: pointer; }
    .pick-item:last-child { border-bottom: none; }
    .pick-item:hover { background: var(--vp-green-light); }
    .pick-item input { accent-color: var(--vp-green); }
    .ind-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .ind-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--vp-green-light); border: 1px solid var(--vp-border); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; font-weight: 600; }
    .ind-chip i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; }
    .ind-chip button { border: none; background: transparent; cursor: pointer; color: var(--vp-gray-500); width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
    .ind-chip button:hover { background: var(--vp-gray-100); color: var(--vp-red); }

const openTabs = {};
let activeTabKey = null;

function openTab(key, title) {
  if (openTabs[key]) { activateTab(key); }
  else {
    openTabs[key] = { title, content: buildContent(key) };
    renderTabBar();
    activateTab(key);
  }
  updateSidebarActive(key);
  if (location.hash !== '#' + key) location.hash = key;
}

function closeTab(key, event) {
  event.stopPropagation();
  const isActive = activeTabKey === key;
  delete openTabs[key];
  renderTabBar();
  if (isActive) {
    const keys = Object.keys(openTabs);
    activeTabKey = keys.length > 0 ? keys[keys.length - 1] : null;
    if (activeTabKey) {
      activateTab(activeTabKey);
      location.hash = activeTabKey;
    } else {
      activeTabKey = null;
      renderContent('');
      if (document.getElementById('topbarBreadcrumb')) updateBreadcrumb('');
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
}

function activateTab(key) {
  activeTabKey = key;
  renderTabBar();
  renderContent(openTabs[key].content);
}

function renderTabBar() {
  const bar = document.getElementById('tabbar');
  bar.innerHTML = Object.keys(openTabs).map(key => {
    const isActive = key === activeTabKey;
    return `<div class="tab ${isActive ? 'active' : ''}" onclick="activateTab('${key}')">${openTabs[key].title}<span class="tab-close" onclick="closeTab('${key}', event)">×</span></div>`;
  }).join('');
}

function renderContent(html) {
  document.getElementById('content').innerHTML = html;
  if (activeTabKey === 'industry') { indInitFilters(); indRenderUnified(); }
  if (activeTabKey === 'research-report') { reportRender(); }
  if (activeTabKey === 'stock-pool') { poolRenderGrid(); poolRenderDetail(); }
  if (activeTabKey === 'portfolio') { portRenderPortfolios(); portRenderShared(); portRenderHoldings(); portRenderRebalances(); portRenderIndicatorLib(); portRenderPerf(); }
  if (activeTabKey === 'index-sim') { idxRenderIndexList(); idxRenderDash(); idxOpsRenderAll(); }
  if (activeTabKey === 'config') { cfgSwitchTab('users'); }
  if (activeTabKey === 'share-class') { scRender(); }
  if (activeTabKey === 'share-class-add') { scAddInit(); }
  if (activeTabKey === 'fee') { feeRender(); }
}
function updateBreadcrumb(text) { if (document.getElementById('topbarBreadcrumb')) document.getElementById('topbarBreadcrumb').textContent = text; }

function toggleSubmenu(id) {
  const sub = document.getElementById('submenu-' + id);
  const item = document.getElementById('menu-' + id);
  sub.classList.toggle('open');
  item.classList.toggle('open');
}

function updateSidebarActive(key) {
  document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
  const map = { 'industry':'industry', 'research-report':'research-report', 'stock-pool':'stock-pool', 'portfolio':'portfolio', 'portfolio-new':'portfolio-new', 'index-sim':'index-sim', 'config':'config', 'product-management':'product-management', 'share-class':'share-class', 'research-share':'research-share' };
  if (key && map[key]) {
    document.querySelectorAll('.submenu-item').forEach(item => {
      if (item.getAttribute('onclick') && item.getAttribute('onclick').startsWith(`openTab('${map[key]}'`)) item.classList.add('active');
    });
  }
}

function indViewLabel() { return indCurrentMarket === "ALL" ? "全部市场" : IND_DATA[indCurrentMarket].name; }

function indGetIndustries() {
  if (indCurrentMarket !== "ALL") return IND_DATA[indCurrentMarket].industries.map(i => ({ ...i, marketNames: [IND_DATA[indCurrentMarket].name] }));
  const grouped = new Map();
  Object.entries(IND_DATA).forEach(([mc, market]) => {
    market.industries.forEach(ind => {
      if (!grouped.has(ind.name)) grouped.set(ind.name, { ...ind, marketNames: [market.name], analysts: [...ind.analysts] });
      else {
        const m = grouped.get(ind.name);
        m.marketNames = [...new Set([...m.marketNames, market.name])];
        const seen = new Set(m.analysts.map(a => a.id));
        ind.analysts.forEach(a => { if (!seen.has(a.id)) { m.analysts.push(a); seen.add(a.id); } });
      }
    });
  });
  return Array.from(grouped.values());
}

const MS_STATE = {};
function msInit(id, options, ph) {
  MS_STATE[id] = { selected: new Set(), ph };

    `<label class="ms-opt"><input type="checkbox" value="${o}" onchange="msPick('${id}',this)">${o}</label>`).join('');

}
function msToggle(id, e) {
  if (e) e.stopPropagation();
  document.querySelectorAll('.ms-panel.open').forEach(p => { if (p.id !== id + 'Panel') p.classList.remove('open'); });
  document.getElementById(id + 'Panel').classList.toggle('open');
}
function msPick(id, cb) {
  cb.checked ? MS_STATE[id].selected.add(cb.value) : MS_STATE[id].selected.delete(cb.value);
  msRender(id);
}
function msRemove(id, v, e) {
  e.stopPropagation();
  MS_STATE[id].selected.delete(v);
  const cb = document.querySelector(`#${id}Panel input[value="${v}"]`);
  if (cb) cb.checked = false;
  msRender(id);
}
function msRender(id) {
  const sel = [...MS_STATE[id].selected];

    aEl.innerHTML = '<option value="">全部研究员</option>' + analysts.map(n => `<option value="${n}">${n}</option>`).join("");

function indDoFilter() { indRenderUnified(); }

function indResetFilter() {
  document.getElementById("indFMarket").value = "";
  document.getElementById("indFIndustry").value = "";
  document.getElementById("indFAnalyst").value = "";
  indRenderUnified();
}

function indRenderUnified() {
  const body = document.getElementById("indUniBody");
  if (!body) return;
  let rows = indGetIndustries();

  // Apply dropdown filters
  const fMarket = document.getElementById("indFMarket")?.value || "";
  const fIndustry = document.getElementById("indFIndustry")?.value || "";
  const fAnalyst = document.getElementById("indFAnalyst")?.value || "";
  if (fMarket) rows = rows.filter(r => (r.marketNames || []).includes(IND_DATA[fMarket]?.name));
  if (fIndustry) rows = rows.filter(r => r.name === fIndustry);
  if (fAnalyst) rows = rows.filter(r => (r.analysts || []).filter(a => a.status === "在职").some(a => a.name === fAnalyst));

  // Attach computed fields
  rows = rows.map((ind, i) => {
    const analysts = (ind.analysts || []).filter(a => a.status === "在职");
    return {
      ...ind,
      _analystNames: analysts.length ? analysts.map(a => a.name).join("、") : "—",
      _updater: analysts.length ? analysts[0].name : "—",
      _stockCount: ind.stocks ? ind.stocks.length : 0,
      _time: ind._time || ["2026/08/20 09:15:32","2026/08/18 14:22:07","2026/08/15 11:03:45","2026/08/12 16:40:18","2026/08/10 08:55:01","2026/08/08 10:30:44","2026/08/05 13:20:11","2026/08/03 15:07:38","2026/08/01 09:42:56","2026/07/30 17:18:22","2026/07/28 11:05:33"][i % 11]
    };
  });

  // Sort
  if (indSortField) {
    rows.sort((a, b) => {
      let av, bv;
      if (indSortField === "name")    { av = a.name; bv = b.name; }
      else if (indSortField === "market")  { av = (a.marketNames || []).join(""); bv = (b.marketNames || []).join(""); }
      else if (indSortField === "analyst") { av = a._analystNames; bv = b._analystNames; }
      else if (indSortField === "updater") { av = a._updater; bv = b._updater; }
      else if (indSortField === "stocks")  { av = a._stockCount; bv = b._stockCount; }
      else if (indSortField === "time")    { av = a._time; bv = b._time; }
      if (av < bv) return indSortDir === "asc" ? -1 : 1;
      if (av > bv) return indSortDir === "asc" ? 1 : -1;
      return 0;
    });
  }

  // Update sort icons
  ["name","market","analyst","stocks","updater","time"].forEach(f => {
    const el = document.getElementById("sort-" + f);
    if (el) el.textContent = f === indSortField ? (indSortDir === "asc" ? "↑" : "↓") : "";
  });

  if (!rows.length) { body.innerHTML = '<tr><td colspan="8" class="muted" style="text-align:center;padding:32px">暂无数据</td></tr>'; return; }
  body.innerHTML = rows.map(ind => {
    const hasStocks = ind.stocks && ind.stocks.length > 0;
    const nameHtml = hasStocks
      ? `<span style="text-decoration:underline;cursor:pointer;color:var(--vp-green)" onclick="indShowStocks('${ind.name}')">${ind.name}</span>`
      : ind.name;
    const checked = indSelected === ind.name ? 'checked' : '';
    return `<tr>
      <td><input type="checkbox" ${checked} onclick="indToggleSelect('${ind.name}')"></td>
      <td class="bold">${nameHtml}</td>
      <td>${(ind.marketNames || []).join("、")}</td>
      <td>${ind._analystNames}</td>
      <td style="font-variant-numeric:tabular-nums">${ind._stockCount}</td>
      <td class="muted">${ind._updater}</td>
      <td class="muted" style="font-variant-numeric:tabular-nums">${ind._time}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="indOpenImport('${ind.name}')">导入股票明细</button></td>
    </tr>`;
  }).join("");
}

let indSortField = "";
let indSortDir = "asc";

function indSort(field) {
  if (indSortField === field) indSortDir = indSortDir === "asc" ? "desc" : "asc";
  else { indSortField = field; indSortDir = "asc"; }
  indRenderUnified();
}

// Show stock panel below the table when clicking an industry name
function indShowStocks(name) {
  const panel = document.getElementById("indStockPanel");
  const title = document.getElementById("indStockTitle");
  const tbody = document.getElementById("indStockBody");
  if (!panel || !title || !tbody) return;
  // Collect all stocks from ALL markets that have this industry name
  const marketMap = { "HK":"港股","US":"美股","JP":"日股","KR":"韩股" };
  const allStocks = [];
  Object.entries(IND_DATA).forEach(([mcode, market]) => {
    const ind = market.industries.find(i => i.name === name);
    if (ind && ind.stocks && ind.stocks.length) {
      ind.stocks.forEach(s => allStocks.push({ ...s, _market: marketMap[mcode] || mcode }));
    }
  });
  title.textContent = name + " — 股票明细";
  if (!allStocks.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">暂无股票数据，请先上传</td></tr>';
  } else {
    tbody.innerHTML = allStocks.map(s => {
      return `<tr>
        <td>${s._market}</td>
        <td><span class="cell-code">${s.code}</span></td>
        <td>${s.name}</td>
        <td style="font-variant-numeric:tabular-nums">${s.r3Score != null ? s.r3Score : '—'}</td>
        <td class="muted">${s.issuer || "—"}</td>
      </tr>`;
    }).join("");
  }
  panel.style.display = "block";
}

  if (!modal || !title || !tbody) return;
  const marketMap = { "HK":"港股","US":"美股","JP":"日股","KR":"韩股" };
  const allStocks = [];
  Object.entries(IND_DATA).forEach(([mcode, market]) => {
    const ind = market.industries.find(i => i.name === name);
    if (ind && ind.stocks && ind.stocks.length) {
      ind.stocks.forEach(s => allStocks.push({ ...s, _market: marketMap[mcode] || mcode }));
    }
  });
  title.textContent = name + " — 股票明细";
  const now = new Date();
  const ts = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

    tbody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">暂无股票数据</td></tr>';

        <td>${s.name}</td>

function reportRender() {
  const body = document.getElementById("reportBody");
  if (!body) return;
  const stock = document.getElementById("searchStock")?.value.trim().toLowerCase() || "";
  const company = document.getElementById("searchCompany")?.value.trim().toLowerCase() || "";
  const creator = document.getElementById("searchCreator")?.value.trim().toLowerCase() || "";
  const market = document.getElementById("filterMarket")?.value || "";
  const industry = document.getElementById("filterIndustry")?.value || "";
  const rating = document.getElementById("filterRating")?.value || "";
  const status = document.getElementById("filterStatus")?.value || "";

  const filtered = REPORTS.filter(r => {
    const matchStock = !stock || (r.stock || "—").toLowerCase().includes(stock);
    const matchCompany = !company || (r.company || "—").toLowerCase().includes(company);
    const matchCreator = !creator || (r.creator || "").toLowerCase().includes(creator);
    const matchMarket = !market || r.market.includes(market);
    const matchIndustry = !industry || r.industry === industry;
    const matchRating = !rating || r.rating === rating;
    const matchStatus = !status || (status === "已发布" ? r.attachment : !r.attachment);
    return matchStock && matchCompany && matchCreator && matchMarket && matchIndustry && matchRating && matchStatus;
  });

  body.innerHTML = filtered.length === 0
    ? '<tr><td colspan="8" class="muted" style="text-align:center;padding:32px">暂无符合筛选条件的研报</td></tr>'
    : filtered.map(r => {
      const att = r.attachment
        ? `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();reportShowAttachment('${r.id}')">${r.attachment.type}</button>`
        : '<span class="muted">—</span>';
      return `<tr style="cursor:pointer" onclick="reportShowDetail('${r.id}')">
        <td class="cell-code">${r.stock || '—'}</td>
        <td><div style="max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500">${r.title}</div><div class="tiny muted">${r.company || '—'}</div></td>
        <td>${r.market} · ${r.industry}</td>
        <td><span class="tag ${r.ratingCls}">${r.rating}</span></td>
        <td>${r.creator}</td>
        <td class="cell-muted">${r.time}</td>
        <td>${att}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openTab('report-edit','修改研报')">修改</button></td>
      </tr>`;
    }).join("");
}

// 订阅维度：按 publisher（发行人/出版方）。一份订阅 = 该 publisher 的全部研报自动推送。
const SHARE_SUBSCRIBED_PUBLISHERS = new Set([
  "Value Partners 投研",
  "Bloomberg Terminal",
]);

function shareAllPublishers() {
  return [...new Set(SHARED_REPORTS.map(r => r.publisher))].sort();
}

function shareIsPublisherSubscribed(p) {
  return SHARE_SUBSCRIBED_PUBLISHERS.has(p);
}

        <option>Bloomberg</option>

        <option>中诚信</option>

function shareInitFilters() {
  shareRenderSubChips();
}

function shareRenderSubChips() {
  const host = document.getElementById("shareSubChips");
  if (!host) return;
  const subs = [...SHARE_SUBSCRIBED_PUBLISHERS];
  host.innerHTML = subs.length
    ? subs.map(p => `<span style="display:inline-flex;align-items:center;gap:6px;background:var(--vp-mint-50);border:1px solid var(--vp-border);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--vp-gray-700)">${p}<b style="cursor:pointer;color:var(--vp-gray-500);font-weight:500" onclick="shareUnsubscribe('${p}')">✕</b></span>`).join("")
    : `<span class="tiny muted">尚未订阅任何发行人，点右上角「＋ 订阅发行人」开始</span>`;
}

function shareRender() {
  const body = document.getElementById("shareBody");
  if (!body) return;
  const stock = document.getElementById("shareSearchStock")?.value.trim().toLowerCase() || "";
  const issuer = document.getElementById("shareSearchIssuer")?.value.trim().toLowerCase() || "";
  const type = document.getElementById("shareFilterType")?.value || "";
  const source = document.getElementById("shareFilterSource")?.value || "";
  const market = document.getElementById("shareFilterMarket")?.value || "";
  const sub = document.getElementById("shareFilterSub")?.value || "";
  const filtered = SHARED_REPORTS.filter(r => {
    if (stock && !(r.stock || "—").toLowerCase().includes(stock)) return false;
    if (issuer && !(r.issuer || "—").toLowerCase().includes(issuer)) return false;
    if (type && r.type !== type) return false;
    if (source && r.source !== source) return false;
    if (market && r.market !== market) return false;
    const isSub = shareIsPublisherSubscribed(r.publisher);
    if (sub === "仅已订阅" && !isSub) return false;
    if (sub === "仅未订阅" && isSub) return false;
    return true;
  });
  body.innerHTML = filtered.length === 0
    ? '<tr><td colspan="10" class="muted" style="text-align:center;padding:32px">暂无符合筛选条件的研报</td></tr>'
    : filtered.map(r => {
      const sourceTag = r.source === "自研"
        ? `<span class="tag tag-green">自研</span>`
        : `<span class="tag tag-blue">${r.source}</span>`;
      const subTag = shareIsPublisherSubscribed(r.publisher)
        ? `<span class="tag tag-green">✓ 已订阅</span>`
        : `<span class="tag tag-gray">未订阅</span>`;
      return `<tr style="cursor:pointer" onclick="shareShowDetail('${r.id}')">
        <td><div style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500">${r.title}</div><div class="tiny muted">${r.publisher}</div></td>
        <td><span class="tag tag-gray">${r.type}</span></td>
        <td>${sourceTag}</td>
        <td class="cell-code">${r.stock || '—'}</td>
        <td>${r.issuer || '—'}</td>
        <td>${r.market} · ${r.industry}</td>
        <td>${r.rating === '—' ? '<span class="muted">—</span>' : `<span class="tag tag-gray">${r.rating}</span>`}</td>
        <td class="cell-muted">${r.publishDate}</td>
        <td>${subTag}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();shareShowDetail('${r.id}')">查看</button></td>
      </tr>`;
    }).join("");
}

function shareReset() {
  ["shareSearchStock","shareSearchIssuer"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  ["shareFilterType","shareFilterSource","shareFilterMarket","shareFilterSub"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
  shareRender();
}

// ====== 订阅弹窗 ======
function shareOpenSubModal() {
  const all = shareAllPublishers();
  const unsub = all.filter(p => !shareIsPublisherSubscribed(p));
  if (!unsub.length) { alert("当前所有发行人均已订阅"); return; }
  const list = document.getElementById("shareSubPickList");
  if (list) list.innerHTML = unsub.map(p => `<label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--vp-border);border-radius:8px;margin-bottom:8px;cursor:pointer"><input type="checkbox" value="${p}"><div><div style="font-weight:600">${p}</div><div class="tiny muted">共 ${SHARED_REPORTS.filter(r=>r.publisher===p).length} 份研报</div></div></label>`).join("");
  document.getElementById("shareSubModal").classList.add("show");
}
function shareCloseSubModal() { document.getElementById("shareSubModal").classList.remove("show"); }
function shareConfirmSub() {
  const checked = [...document.querySelectorAll("#shareSubPickList input:checked")].map(c => c.value);
  if (!checked.length) { alert("请勾选至少一个发行人"); return; }
  checked.forEach(p => SHARE_SUBSCRIBED_PUBLISHERS.add(p));
  shareCloseSubModal();
  shareRenderSubChips();
  shareRender();
  alert(`已订阅 ${checked.length} 个发行人：\n${checked.join("、")}\n新研报将自动同步到产品研究工作台`);
}

function shareOpenUnsubModal() {
  const subs = [...SHARE_SUBSCRIBED_PUBLISHERS];
  if (!subs.length) { alert("尚未订阅任何发行人"); return; }
  const list = document.getElementById("shareUnsubPickList");
  if (list) list.innerHTML = subs.map(p => `<label style="display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--vp-border);border-radius:8px;margin-bottom:8px;cursor:pointer"><input type="checkbox" value="${p}"><div><div style="font-weight:600">${p}</div><div class="tiny muted">取消后该发行人新研报将不再推送</div></div></label>`).join("");
  document.getElementById("shareUnsubModal").classList.add("show");
}
function shareCloseUnsubModal() { document.getElementById("shareUnsubModal").classList.remove("show"); }
function shareConfirmUnsub() {
  const checked = [...document.querySelectorAll("#shareUnsubPickList input:checked")].map(c => c.value);
  if (!checked.length) { alert("请勾选要取消订阅的发行人"); return; }
  checked.forEach(p => SHARE_SUBSCRIBED_PUBLISHERS.delete(p));
  shareCloseUnsubModal();
  shareRenderSubChips();
  shareRender();
}
function shareUnsubscribe(p) {
  if (!confirm(`确定取消订阅「${p}」吗？\n该发行人新研报将不再推送到工作台。`)) return;
  SHARE_SUBSCRIBED_PUBLISHERS.delete(p);
  shareRenderSubChips();
  shareRender();
}

function shareShowDetail(id) {
  const r = SHARED_REPORTS.find(x => x.id === id);
  if (!r) return;
  const isSub = shareIsPublisherSubscribed(r.publisher);
  const access = isSub || r.source === "自研" ? "可查看全文" : "未订阅，仅看摘要";
  alert(`研报详情\n标题：${r.title}\n类型：${r.type}\n来源：${r.source}（${r.publisher}）\n股票：${r.stock}（${r.issuer}）\n市场：${r.market}\n行业：${r.industry}\n评级：${r.rating}\n发布日期：${r.publishDate}\n订阅状态：${isSub ? "已订阅（" + r.publisher + "）" : "未订阅"}\n访问权限：${access}`);
}

function shareShowDetail(id) {
  const r = SHARED_REPORTS.find(x => x.id === id);
  if (!r) return;
  alert(`研报详情\n标题：${r.title}\n类型：${r.type}\n来源：${r.source}（${r.publisher}）\n股票：${r.stock}（${r.issuer}）\n市场：${r.market}\n行业：${r.industry}\n评级：${r.rating}\n发布日期：${r.publishDate}\n订阅：${r.subscribed ? "已订阅" : "未订阅"}`);
}

// 根据股票代码自动带出市场和行业
function reportAutoFill(code) {
  if (!code) return;
  const suffix = code.split('.').pop()?.toUpperCase();
  const marketMapCode = { 'HK': 'HK', 'US': 'US', 'SH': 'CN', 'SZ': 'CN', 'CN': 'CN', 'JP': 'JP', 'KS': 'KR' };
  const marketCode = marketMapCode[suffix];
  if (!marketCode) return;

  const industrySel = document.getElementById('reportIndustry');
  if (industrySel && marketCode && IND_DATA[marketCode]) {
    const opts = IND_DATA[marketCode].industries.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
    industrySel.innerHTML = `<option value="">请选择行业</option>${opts}`;
  }
}

function scRender() {
  const body = document.getElementById("scBody");
  if (!body) return;
  const fundCode = document.getElementById("scFundCode")?.value.trim().toLowerCase() || "";
  const name = document.getElementById("scName")?.value.trim().toLowerCase() || "";
  const ccy = document.getElementById("scCcy")?.value || "";
  const st = document.getElementById("scSt")?.value || "";
  const rows = SC_RECORDS.filter(r => {
    const matchCode = !fundCode || r.fund.toLowerCase().includes(fundCode);
    const matchName = !name || r.className.toLowerCase().includes(name) || r.vpid.toLowerCase().includes(name) || r.isin.toLowerCase().includes(name);
    const matchCcy = !ccy || r.ccy === ccy;
    const matchSt = !st || r.status === st;
    return matchCode && matchName && matchCcy && matchSt;
  });
  body.innerHTML = rows.length === 0
    ? `<tr><td colspan="11" class="muted" style="text-align:center;padding:32px">暂无符合条件的份额类别</td></tr>`
    : rows.map(r => {
      const stTag = `<span class="tag ${SC_STATUS_TAG[r.status] || 'tag-gray'}">${r.status}</span>`;
      return `<tr>
        <td><span class="cell-code">${r.fund}</span></td>
        <td><div class="cell-name">${r.className}</div></td>
        <td class="cell-muted">${r.vpid}</td>
        <td class="cell-muted">${r.isin}</td>
        <td>${r.ccy}</td>
        <td>${stTag}</td>
        <td class="cell-muted">${r.launch}</td>
        <td class="cell-muted">${r.cutoff}</td>
        <td>${r.freq}</td>
        <td class="cell-muted">${r.mgmtFee}</td>
        <td class="cell-muted">${r.settle}</td>
      </tr>`;
    }).join("");
}

    ${row(['最新TER比率（%）','Latest TER Rate (%)',`<input type="number" class="form-control" ${IN} id="sc-latestTerRate" placeholder="${scLang==='en'?'e.g. 1.65':'如 1.65'}" step="0.01" min="0">`], ['交易频率','Dealing Frequency',`<select class="form-control" ${IN} id="sc-dealingFrequency"><option value="">${scLang==='en'?'Select':'请选择'}</option>${freqOpts.map(f => `<option>${f}</option>`).join('')}</select>`], false, true)}

    ${row(['估值时点','Valuation Point',`<div style="display:flex;gap:6px;flex:1"><input type="time" class="form-control" style="flex:1" id="sc-valuationPoint" value="09:30"><select class="form-control" style="flex:0 0 80px" id="sc-valuationPointTz"><option>IRL</option>${TZ_OPTS.filter(t=>t!=='IRL').map(t=>`<option>${t}</option>`).join('')}</select></div>`], ['合约单据交付日（T+）','Contract Note Delivery Day (T+)',`<input type="number" class="form-control" ${IN} id="sc-contractNoteDeliveryDay" placeholder="T+" min="0">`], true, false)}

    ${row(['证券借贷','Security Lending',`<select class="form-control" ${IN} id="sc-securityLending"><option value="">${scLang==='en'?'Select':'请选择'}</option><option value="true">${scLang==='en'?'Yes':'是'}</option><option value="false">${scLang==='en'?'No':'否'}</option></select>`], ['','',''], false, false)}

    <div style="grid-column:1/-1;padding-top:20px;display:flex;gap:12px;border-top:1px solid var(--vp-border);margin-top:8px">
      <button class="btn btn-secondary" onclick="scAddSaveDraft()">💾 ${scLang==='en'?'Save Draft':'保存草稿'}</button>
      <button class="btn btn-primary" onclick="scAddSubmit()">${scLang==='en'?'Submit':'提交'}</button>
      <button class="btn btn-secondary" onclick="closeTab('share-class-add', event)">${scLang==='en'?'Cancel':'取消'}</button>
    </div>

  </div>
  </div></div>`;
}

function scSwitchLang(lang) {
  scLang = lang;
  const card = document.querySelector('#content .card');
  if (!card) return;
  const isEn = lang === 'en';

  // Update all label/span elements with data-zh/data-en
  card.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = isEn ? el.dataset.en : el.dataset.zh;
  });

  // Update placeholders
  const ph = {
    'sc-fundNameEn': isEn ? 'Select a fund to auto-fill' : '选择基金后自动填充',
    'sc-fundNameTc': isEn ? 'Select a fund to auto-fill' : '选择基金后自动填充',
    'sc-fundNameSc': isEn ? 'Select a fund to auto-fill' : '选择基金后自动填充',
    'sc-shareClassNameEn': isEn ? 'Official English name, max 200 chars' : 'Official English name，不超过200字符',
    'sc-shareClassNameTc': isEn ? 'Official Traditional Chinese name' : '官方繁体中文名称，不超过200字符',
    'sc-shareClassNameSc': isEn ? 'Official Simplified Chinese name' : '官方简体中文名称，不超过200字符',
    'sc-vpfsClassId': isEn ? 'e.g. VP0010-A-USD-ACC' : '如 VP0010-A-USD-ACC',
    'sc-isinCode': isEn ? '12 chars, e.g. HK0000012345' : '12字符，如 HK0000012345',
    'sc-cusip': isEn ? '9 chars' : '9位字母数字',
    'sc-bloombergTicker': isEn ? 'e.g. VP0010A UH' : '如 VP0010A UH',
    'sc-bbgIdEquity': isEn ? 'e.g. EQ0010A' : '如 EQ0010A',
    'sc-sedol': isEn ? '7 chars' : '7位字母数字',
    'sc-morningstarFundId': isEn ? 'Optional' : '选填',
    'sc-morningstarSecId': isEn ? 'Optional' : '选填',
    'sc-morningstarPerfId': isEn ? 'Optional' : '选填',
    'sc-stockCode': isEn ? '1-5 digits' : '1-5位数字',
    'sc-valorCode': isEn ? 'Optional' : '选填',
    'sc-lipperCode': isEn ? 'Optional' : '选填',
    'sc-minInitialSub': isEn ? 'e.g. 10000' : '如 10000',
    'sc-minSubSub': isEn ? 'e.g. 1000' : '如 1000',
    'sc-minRedemption': isEn ? 'e.g. 500' : '如 500',
    'sc-minHolding': isEn ? 'e.g. 1000' : '如 1000',
    'sc-redemptionCharge': isEn ? 'e.g. 0.5' : '如 0.5',
    'sc-managementFee': isEn ? 'e.g. 1.25' : '如 1.25',
    'sc-performanceFee': isEn ? 'e.g. 15.00' : '如 15.00',
    'sc-latestTerRate': isEn ? 'e.g. 1.65' : '如 1.65',
    'sc-valuationDeliveryTime': isEn ? 'Positive integer' : '正整数',
    'sc-businessDayDefinition': isEn ? 'e.g. Excl. HK Sat, Sun & public holidays' : '如：非香港周六、日及公众假期',
  };
  Object.entries(ph).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.placeholder = val;
  });

  // Update select options
  const statusOpts = isEn ? ['Active','Inactive','Terminated'] : ['Active 运作中','Inactive 非运作','Terminated 已终止'];
  const distOpts = isEn ? ['Monthly','Quarterly','Annually','N/A'] : ['Monthly 月度','Quarterly 季度','Annually 年度','N/A 不适用'];
  const fyOpts = isEn ? ['31 March','30 June','31 December'] : ['31-March 3月31日','30-June 6月30日','31-December 12月31日'];
  const freqOpts = isEn ? ['Daily','Weekly','Monthly','Quarterly','Yearly'] : ['Daily 每日','Weekly 每周','Monthly 每月','Quarterly 每季','Yearly 每年'];
  const pricingOpts = isEn ? ['Amortization','Cost','Mark to Market'] : ['Amortization 摊销','Cost 成本','Mark to Market 市价计量'];
  const yesNo = isEn ? ['Yes','No'] : ['是','否'];
  const autoCcy = isEn ? 'Auto (same ccy)' : '自动（同类货币）';
  const selectOpts = {
    'sc-fundClassStatus': [isEn ? 'Select status' : '请选择状态', ...statusOpts],
    'sc-distributionPolicy': [isEn ? 'Select' : '请选择', ...distOpts],
    'sc-hedged': [isEn ? 'Select' : '请选择', ...yesNo],
    'sc-hedgingCurrency': [autoCcy],
    'sc-unitPrecision': [isEn ? 'Select' : '请选择', '2','3','4'],
    'sc-navPrecision': [isEn ? 'Select' : '请选择', '0','2','4'],
    'sc-financialYearEnd': [isEn ? 'Select' : '请选择', ...fyOpts],
    'sc-dealingFrequency': [isEn ? 'Select' : '请选择', ...freqOpts],
    'sc-valuationFrequency': [isEn ? 'Select' : '请选择', ...freqOpts],
    'sc-securityLending': [isEn ? 'Select' : '请选择', ...yesNo],
    'sc-subscriptionSettlement': [],
    'sc-redemptionSettlement': [],
    'sc-businessCalendar': [isEn ? 'Select' : '请选择', ...(isEn ? ['Hong Kong','Taiwan','Japan','PRC - Stock Exchange','PRC - Bank','Ireland','UK','Relevant Market as per Prospectus'] : ['香港','台湾','日本','中国大陆 — 交易所','中国大陆 — 银行','爱尔兰','英国','相关市场（章程）'])],
    'sc-pricingMethodology': [isEn ? 'Select' : '请选择', ...pricingOpts],
  };
  Object.entries(selectOpts).forEach(([id, opts]) => {
    const sel = document.getElementById(id);
    if (!sel || !sel.options.length) return;
    if (opts.length) {
      sel.innerHTML = opts.map(o => `<option value="${o === opts[0] ? '' : o}">${o}</option>`).join('');
    }
  });

  // For selects that have dynamic options (e.g. currencies), just update the first placeholder option text
  const hedgingCcySel = document.getElementById('sc-hedgingCurrency');
  if (hedgingCcySel && hedgingCcySel.options.length) {
    hedgingCcySel.options[0].textContent = isEn ? 'Auto (same ccy)' : '自动（同类货币）';
  }
  const classCcySel = document.getElementById('sc-classCurrency');
  if (classCcySel && classCcySel.options.length) {
    classCcySel.options[0].textContent = isEn ? 'Select currency' : '请选择货币';
  }
  const fundSel = document.getElementById('sc-fundCode');
  if (fundSel && fundSel.options.length) {
    fundSel.options[0].textContent = isEn ? 'Select fund' : '请选择基金';
  }

  // Update pricing checkbox labels — use data-zh/en on the span inside label
  card.querySelectorAll('[id^="sc-pricing-"]').forEach(chk => {
    const label = chk.closest('label');
    if (!label) return;
    const span = label.querySelector('span[data-zh]');
    if (span) span.textContent = isEn ? span.dataset.en : span.dataset.zh;
  });

  // Update toggle buttons
  card.querySelectorAll('.lang-toggle button').forEach(btn => {
    const isThisLang = btn.textContent === (isEn ? 'EN' : '简');
    btn.className = 'btn btn-sm ' + (isThisLang ? 'btn-primary' : 'btn-ghost');
    btn.style.cssText = 'padding:4px 12px;font-size:12px;border:none;background:none;border-radius:4px;cursor:pointer';
  });

  // Update footer buttons
  const footerBtns = card.querySelectorAll('.card-body > div:last-child button');
  if (footerBtns[0]) footerBtns[0].innerHTML = '💾 ' + (isEn ? 'Save Draft' : '保存草稿');
  if (footerBtns[1]) footerBtns[1].textContent = isEn ? 'Submit' : '提交';
  if (footerBtns[2]) footerBtns[2].textContent = isEn ? 'Cancel' : '取消';
}

function scAddInit() {
  // Auto-fill fund names when fund code changes
  const fundSel = document.getElementById('sc-fundCode');
  if (fundSel) {
    fundSel.addEventListener('change', function() {
      const p = PRODUCTS.find(p => p.code === this.value);
      const en = document.getElementById('sc-fundNameEn');
      const tc = document.getElementById('sc-fundNameTc');
      const sc = document.getElementById('sc-fundNameSc');
      if (en) en.value = p ? p.nameEn : '';
      if (tc) tc.value = p ? p.nameTc : '';
      if (sc) sc.value = p ? p.nameTc : ''; // SC falls back to TC when no SC defined
    });
  }
}

function clearScErrors() {
  document.querySelectorAll('.sc-error').forEach(el => el.classList.remove('sc-error'));
  document.querySelectorAll('.sc-err-msg').forEach(el => el.remove());
}
function scMarkErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.borderColor = '#dc2626';
  el.classList.add('sc-error');
  const d = document.createElement('div');
  d.className = 'sc-err-msg';
  d.style = 'font-size:11px;color:#dc2626;margin-top:2px';
  d.textContent = msg;
  el.parentElement.appendChild(d);
}

function scAddSaveDraft() {
  clearScErrors();
  let ok = true;
  const fundCode = document.getElementById('sc-fundCode')?.value.trim();
  const vpfsClassId = document.getElementById('sc-vpfsClassId')?.value.trim();
  const nameEn = document.getElementById('sc-shareClassNameEn')?.value.trim();
  const nameTc = document.getElementById('sc-shareClassNameTc')?.value.trim();
  const nameSc = document.getElementById('sc-shareClassNameSc')?.value.trim();
  if (!fundCode) { scMarkErr('sc-fundCode', '请选择基金代码'); ok = false; }
  if (!vpfsClassId) { scMarkErr('sc-vpfsClassId', '请输入 VPFS Class ID'); ok = false; }
  else if (SC_RECORDS.some(r => r.vpid === vpfsClassId)) { scMarkErr('sc-vpfsClassId', '该 VPFS Class ID 已存在'); ok = false; }
  if (!nameEn) { scMarkErr('sc-shareClassNameEn', '请输入类别英文名称'); ok = false; }
  if (!nameTc) { scMarkErr('sc-shareClassNameTc', '请输入类别繁体名称'); ok = false; }
  if (!nameSc) { scMarkErr('sc-shareClassNameSc', '请输入类别简体名称'); ok = false; }
  if (!ok) return;
  alert('草稿已保存');
}

function scAddSubmit() {
  clearScErrors();
  let ok = true;

  // Tab 1 required fields
  const fundCode = document.getElementById('sc-fundCode')?.value.trim();
  const vpfsClassId = document.getElementById('sc-vpfsClassId')?.value.trim();
  const fundClassStatus = document.getElementById('sc-fundClassStatus')?.value.trim();
  const classCurrency = document.getElementById('sc-classCurrency')?.value.trim();
  const launchDate = document.getElementById('sc-launchDate')?.value.trim();
  const nameEn = document.getElementById('sc-shareClassNameEn')?.value.trim();
  const nameTc = document.getElementById('sc-shareClassNameTc')?.value.trim();
  const nameSc = document.getElementById('sc-shareClassNameSc')?.value.trim();
  const businessDayDef = document.getElementById('sc-businessDayDefinition')?.value.trim();
  const distributionPolicy = document.getElementById('sc-distributionPolicy')?.value.trim();
  const hedged = document.getElementById('sc-hedged')?.value.trim();
  const unitPrecision = document.getElementById('sc-unitPrecision')?.value.trim();
  const navPrecision = document.getElementById('sc-navPrecision')?.value.trim();
  const dealingFrequency = document.getElementById('sc-dealingFrequency')?.value.trim();
  const valuationFrequency = document.getElementById('sc-valuationFrequency')?.value.trim();
  const cutoffTime = document.getElementById('sc-cutoffTime')?.value.trim();
  const dealingCutOff = document.getElementById('sc-dealingCutOff')?.value.trim();
  const valuationPoint = document.getElementById('sc-valuationPoint')?.value.trim();
  const subSettlement = document.getElementById('sc-subscriptionSettlement')?.value.trim();
  const redSettlement = document.getElementById('sc-redemptionSettlement')?.value.trim();
  const minInitSub = document.getElementById('sc-minInitialSub')?.value.trim();
  const minSubSub = document.getElementById('sc-minSubSub')?.value.trim();
  const minRedemption = document.getElementById('sc-minRedemption')?.value.trim();
  const cutoffTz = document.getElementById('sc-cutoffTz')?.value.trim();
  const dealingCutOffTz = document.getElementById('sc-dealingCutOffTz')?.value.trim();
  const valuationPointTz = document.getElementById('sc-valuationPointTz')?.value.trim();

  // Calendar checkboxes
  const businessCalendar = document.getElementById('sc-businessCalendar')?.value.trim();
  const pricingMethodology = document.getElementById('sc-pricingMethodology')?.value.trim();

  if (!fundCode) { scMarkErr('sc-fundCode', '请选择基金代码'); ok = false; }
  if (!vpfsClassId) { scMarkErr('sc-vpfsClassId', '请输入 VPFS Class ID'); ok = false; }
  if (!fundClassStatus) { scMarkErr('sc-fundClassStatus', '请选择份额类状态'); ok = false; }
  if (!classCurrency) { scMarkErr('sc-classCurrency', '请选择份额类货币'); ok = false; }
  if (!launchDate) { scMarkErr('sc-launchDate', '请输入成立日期'); ok = false; }
  if (!nameEn) { scMarkErr('sc-shareClassNameEn', '请输入类别英文名称'); ok = false; }
  else if (nameEn.length > 200) { scMarkErr('sc-shareClassNameEn', '不超过200字符'); ok = false; }
  if (!nameTc) { scMarkErr('sc-shareClassNameTc', '请输入类别繁体名称'); ok = false; }
  else if (nameTc.length > 200) { scMarkErr('sc-shareClassNameTc', '不超过200字符'); ok = false; }
  if (!nameSc) { scMarkErr('sc-shareClassNameSc', '请输入类别简体名称'); ok = false; }
  else if (nameSc.length > 200) { scMarkErr('sc-shareClassNameSc', '不超过200字符'); ok = false; }

  // ISIN regex
  const isin = document.getElementById('sc-isinCode')?.value.trim().toUpperCase();
  if (isin && !/^[A-Z]{2}[A-Z0-9]{10}$/.test(isin)) { scMarkErr('sc-isinCode', 'ISIN 为12位字母数字（2字母+10位）'); ok = false; }
  // CUSIP regex
  const cusip = document.getElementById('sc-cusip')?.value.trim().toUpperCase();
  if (cusip && !/^[A-Z0-9]{9}$/.test(cusip)) { scMarkErr('sc-cusip', 'CUSIP 为9位字母数字'); ok = false; }
  // SEDOL regex
  const sedol = document.getElementById('sc-sedol')?.value.trim().toUpperCase();
  if (sedol && !/^[A-Z0-9]{7}$/.test(sedol)) { scMarkErr('sc-sedol', 'SEDOL 为7位字母数字'); ok = false; }
  // Stock code regex
  const stockCode = document.getElementById('sc-stockCode')?.value.trim();
  if (stockCode && !/^\d{1,5}$/.test(stockCode)) { scMarkErr('sc-stockCode', '股票代码为1-5位数字'); ok = false; }

  // Tab 2 required
  if (!distributionPolicy) { scMarkErr('sc-distributionPolicy', '请选择分配政策'); ok = false; }
  if (!hedged) { scMarkErr('sc-hedged', '请选择对冲'); ok = false; }
  if (!unitPrecision) { scMarkErr('sc-unitPrecision', '请选择单位精度'); ok = false; }
  if (!navPrecision) { scMarkErr('sc-navPrecision', '请选择净值精度'); ok = false; }
  if (!businessDayDef) { scMarkErr('sc-businessDayDefinition', '请输入业务日定义'); ok = false; }
  if (!businessCalendar) { scMarkErr('sc-businessCalendar', scLang === 'en' ? 'Required' : '请选择营业日历'); ok = false; }
  if (!cutoffTime) { scMarkErr('sc-cutoffTime', '请输入截止时间'); ok = false; }
  if (!dealingCutOff) { scMarkErr('sc-dealingCutOff', '请输入交易截止'); ok = false; }
  if (!valuationPoint) { scMarkErr('sc-valuationPoint', '请输入估值时点'); ok = false; }
  if (!dealingFrequency) { scMarkErr('sc-dealingFrequency', '请选择交易频率'); ok = false; }
  if (!valuationFrequency) { scMarkErr('sc-valuationFrequency', '请选择估值频率'); ok = false; }
  if (!subSettlement) { scMarkErr('sc-subscriptionSettlement', '请输入申购结算'); ok = false; }
  if (!redSettlement) { scMarkErr('sc-redemptionSettlement', '请输入赎回结算'); ok = false; }
  if (!minInitSub) { scMarkErr('sc-minInitialSub', '请输入最低首次申购金额'); ok = false; }
  if (!minSubSub) { scMarkErr('sc-minSubSub', '请输入最低追加申购金额'); ok = false; }
  if (!minRedemption) { scMarkErr('sc-minRedemption', '请输入最低赎回金额'); ok = false; }
  if (!pricingMethodology) { scMarkErr('sc-pricingMethodology', scLang === 'en' ? 'Required' : '请选择定价方法'); ok = false; }

  if (!ok) { alert('请填写所有必填项（*标记）并修正格式错误'); return; }
  alert('提交成功！');
  closeTab('share-class-add', event);
}

let prodSortField = '';

let prodSelected = '';

      <td><div class="cell-name">${p.nameEn}</div><div class="tiny muted">${p.nameTc}</div></td>
      <td>${p.type}</td>

      <td>${stTag}</td>

    <div class="flex gap-2">

  <div class="card"><div class="card-body"><div style="display:flex;flex-wrap:nowrap;gap:12px;align-items:center">
    <div style="margin:0;flex-shrink:0;display:flex;align-items:center;gap:6px"><label class="form-label" style="margin:0">基金代码</label><input type="text" class="form-control" id="prodSearchCode" placeholder="如 VP0010"></div>
    <div style="margin:0;flex-shrink:0;display:flex;align-items:center;gap:6px"><label class="form-label" style="margin:0">基金名称</label><input type="text" class="form-control" id="prodSearchName" placeholder="搜索名称..."></div>

      <th></th>

      <th class="sortable" onclick="prodSort('nameEn')">基金名称 <span class="sort-icon">${sortIcon('nameEn')}</span></th>
      <th class="sortable" onclick="prodSort('type')">基金类型 <span class="sort-icon">${sortIcon('type')}</span></th>
      <th class="sortable" onclick="prodSort('domicile')">注册地 <span class="sort-icon">${sortIcon('domicile')}</span></th>
      <th class="sortable" onclick="prodSort('status')">状态 <span class="sort-icon">${sortIcon('status')}</span></th>

    </table>
    <div class="pagination-bar"><span class="pagination-info">共 ${PRODUCTS.length} 条</span><div class="pagination"><button class="page-btn" disabled>←</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn">→</button></div></div>
  </div></div>`;
}

function prodSort(field) {
  if (prodSortField === field) prodSortDir = prodSortDir === 'asc' ? 'desc' : 'asc';
  else { prodSortField = field; prodSortDir = 'asc'; }
  PRODUCTS.sort((a, b) => {
    let av = a[field], bv = b[field];
    if (field === 'code') { av = a.code; bv = b.code; }
    if (field === 'nameEn') { av = a.nameEn; bv = b.nameEn; }
    if (field === 'updateTime') {
      av = a.updateTime.replace(/\//g, ''); bv = b.updateTime.replace(/\//g, '');
    }
    if (av < bv) return prodSortDir === 'asc' ? -1 : 1;
    if (av > bv) return prodSortDir === 'asc' ? 1 : -1;
    return 0;
  });
  document.getElementById('content').innerHTML = buildProductManagement();
}

function prodExport() { alert('原型：导出产品数据为 Excel'); }
function prodOpenDetail(code) { alert("查看产品详情：" + code); }
function prodResetFilter() { document.getElementById("prodSearchCode").value=""; document.getElementById("prodSearchName").value=""; document.getElementById("prodSearchType").value=""; document.getElementById("prodSearchDom").value=""; document.getElementById("prodSearchSt").value=""; }
function prodDoFilter() { alert("原型：按条件筛选"); }
function prodSelect(code, checked) { prodSelected = checked ? code : ''; document.getElementById('content').innerHTML = buildProductManagement(); }
function prodEditSelected() { if (!prodSelected) { alert('请先选择一个产品'); return; } alert('原型：修改产品 ' + prodSelected); }
function prodDeleteSelected() { if (!prodSelected) { alert('请先选择一个产品'); return; } if (confirm('确认删除 ' + prodSelected + '？')) { alert('原型：删除产品 ' + prodSelected); prodSelected = ''; document.getElementById('content').innerHTML = buildProductManagement(); } }

function addAssetRow() {

  row.innerHTML = `

      <option>招募说明书</option><option>年报</option><option>半年报</option><option>季报</option><option>净值报告</option><option>合同</option><option>其他</option>
    </select>

    <div class="form-label" id="asset-size-${id}" style="width:100px;text-align:right;padding-right:8px;font-size:12px;color:var(--vp-gray-400)">—</div>
    <div class="form-label" id="asset-date-${id}" style="width:80px;text-align:right;padding-right:8px;font-size:12px;color:var(--vp-gray-400)"></div>
    <div style="width:80px;text-align:center">
      <button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:12px;color:var(--vp-green)" onclick="document.getElementById('asset-upload-${id}').click()">上传</button>
      <button class="btn btn-ghost btn-sm" style="width:28px;height:28px;padding:0;font-size:14px;color:var(--vp-gray-400)" onclick="document.getElementById('asset-row-${id}').remove()">×</button>
    </div>
    <input type="file" id="asset-upload-${id}" style="display:none" onchange="assetFileChanged(this, '${id}')">`;
  body.appendChild(row);
}

function assetFileChanged(input, id) {
  const file = input.files[0];
  if (!file) return;
  const nameEl = document.getElementById('asset-name-' + id);
  const sizeEl = document.getElementById('asset-size-' + id);
  const dateEl = document.getElementById('asset-date-' + id);
  if (nameEl) { nameEl.textContent = file.name; nameEl.style.color = ''; }
  if (sizeEl) { sizeEl.textContent = (file.size / 1024).toFixed(1) + ' KB'; sizeEl.style.color = ''; }
  if (dateEl) {
    const d = new Date();
    dateEl.textContent = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    dateEl.style.color = '';
  }
}

function prodMarkErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('prod-error');
  const d = document.createElement('div');
  d.className = 'prod-err-msg';
  d.style = 'font-size:11px;color:#dc2626;margin-top:2px';
  d.textContent = msg;
  el.parentElement.appendChild(d);
}

function prodSaveDraft() {
  clearProdErrors();
  let ok = true;
  const code = document.getElementById('f-fundCode')?.value.trim();
  const nameEn = document.getElementById('f-fundNameEn')?.value.trim();
  const nameTc = document.getElementById('f-fundNameTc')?.value.trim();
  const mgr = document.getElementById('f-fundManager')?.value.trim();
  if (!code) { prodMarkErr('f-fundCode', '请输入基金代码'); ok = false; }
  else if (PRODUCTS.some(p => p.code === code)) { prodMarkErr('f-fundCode', '该基金代码已存在'); ok = false; }
  if (!nameEn) { prodMarkErr('f-fundNameEn', '请输入基金英文名称'); ok = false; }
  if (!nameTc) { prodMarkErr('f-fundNameTc', '请输入基金繁体名称'); ok = false; }
  if (!mgr) { prodMarkErr('f-fundManager', '请输入基金经理'); ok = false; }
  if (!ok) return;
  alert('草稿已保存');
}

function prodSubmit() {
  clearProdErrors();
  let ok = true;
  const required = [
    ['f-fundCode','基金代码'], ['f-fundNameEn','基金英文名称'], ['f-fundNameTc','基金繁体名称'],
    ['f-fundType','基金类型'], ['f-domicileJurisdiction','注册地/管辖区'],
    ['f-primaryRegulator','主要监管机构'], ['f-fundStatus','基金状态'],
    ['f-complexProduct','复杂产品'], ['f-fundManager','基金经理'],
    ['f-fundManagerLei','基金经理LEI'], ['f-primaryInstrumentType','主要工具类型'],
    ['f-passiveOrActiveFund','被动/主动基金'], ['f-investmentMarketFocus','投资市场聚焦'],
    ['f-riskLevel','风险等级'], ['f-leverageRatioMax','最高杠杆比率'],
    ['f-derivativesRatioMax','最高衍生品比率'], ['f-borrowingLimit','借款限额'],
    ['f-stopLossLimit','止损限额'], ['f-investmentObjective','投资目标'],
    ['f-investmentStrategy','投资策略']
  ];
  required.forEach(([id, label]) => {
    const el = document.getElementById(id);
    if (!el?.value.trim()) { prodMarkErr(id, label + '为必填项'); ok = false; }
  });
  if (!ok) { alert('请填写所有必填项（*标记）'); return; }
  alert('提交成功！');
}

function portPerfNavData() {
  if (portCurRange === "CUS") {
    const f = new Date(portIndDateFrom), t = new Date(portIndDateTo);
    const mid = new Date((+f + +t) / 2);
    const p = d => `${String(d.getFullYear()).slice(2)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const full = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return { dates:[p(f), p(mid), p(t)], fullDates:[full(f), full(mid), full(t)], nav:[1.000,1.064,1.128], bm:[1.000,1.031,1.052] };
  }
  return NAV_SERIES[portCurRange];
}

function portPerfIndSeries(ind, n) {
  const anchors = portCurRange === "1M" ? [ind.m1, ind.value]
    : portCurRange === "3M" ? [ind.m3, ind.m1, ind.value]
    : [ind.m6, ind.m3, ind.m1, ind.value];
  const out = [];
  for (let i = 0; i < n; i++) {
    const pos = i / (n - 1) * (anchors.length - 1);
    const k = Math.min(Math.floor(pos), anchors.length - 2);
    out.push(anchors[k] + (anchors[k + 1] - anchors[k]) * (pos - k));
  }
  return out;
}

function portRenderPerf() {
  document.querySelectorAll("#portRangeSeg .seg").forEach(b => {
    b.classList.toggle("active", b.dataset.range === portCurRange);
    b.onclick = () => { portCurRange = b.dataset.range; portRenderPerf(); };
  });
  const crEl = document.getElementById("portCustomRange");
  if (crEl) crEl.style.display = portCurRange === "CUS" ? "" : "none";
  const bmEl = document.getElementById("portBmToggle");
  if (bmEl) bmEl.onchange = e => { portShowBm = e.target.checked; portRenderPerf(); };
  const wrap = document.getElementById("portPerfWrap");
  if (!wrap) return;
  const navHost = document.getElementById("portNavChart");
  const indHost = document.getElementById("portIndChart");
  const tip = document.getElementById("portPerfTip");
  const data = portPerfNavData();
  const n = data.dates.length;
  const C_PORT = "var(--vp-green)", C_BM = "var(--vp-red)";
  const picked = Object.values(IND_POOL).flat().filter(i => i.picked);
  const indSeries = picked.slice(0,8).map((ind,k) => {
    const vals = portPerfIndSeries(ind, n);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi-lo)*0.15||Math.abs(hi)*0.02||0.1;
    lo-=pad; hi+=pad;
    return { ind, raw: vals, pts: vals.map(v=>(v-lo)/(hi-lo)), color: IND_COLORS[k%IND_COLORS.length], lo, hi };
  });
  const dateLabel = i => portCurRange === "CUS" ? data.fullDates[i]
    : (portCurRange==="1Y"||portCurRange==="3Y"||portCurRange==="MAX") ? data.dates[i] : "2026-"+data.dates[i];

  // panel 标签 + 图例
  document.getElementById("portNavPl").innerHTML = `净值（真实刻度）` +
    `<span class="lg"><i style="background:${C_PORT}"></i>模拟组合</span>` +
    (portShowBm ? `<span class="lg"><i style="background:${C_BM}"></i>恒生指数</span>` : "");
  document.getElementById("portIndPl").innerHTML = `指标（相对位置）<span class="lg" style="font-weight:400">已选 ${picked.length} 项 · 勾选即上图</span>` +
    indSeries.map(s => `<span class="lg"><i style="background:${s.color}"></i>${s.ind.name}</span>`).join("");

  // ---- 上 panel：净值（真实刻度）----
  const W = 760, HN = 150, PL = 44, PR = 56, PT = 8, PB = 20;
  const iw = W-PL-PR, ihn = HN-PT-PB;
  const all = portShowBm ? data.nav.concat(data.bm) : data.nav;
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad2 = (hi-lo)*0.08||0.01; lo-=pad2; hi+=pad2;
  const X = i => PL + iw*i/(n-1);
  const YN = v => PT + ihn*(1-(v-lo)/(hi-lo));
  const line = arr => arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${YN(v).toFixed(1)}`).join("");
  let gridN = "";
  for (let t=0;t<=4;t++){ const v=lo+(hi-lo)*t/4;
    gridN += `<line x1="${PL}" y1="${YN(v)}" x2="${W-PR}" y2="${YN(v)}" stroke="var(--vp-gray-100)" stroke-width="1"/>` +
      `<text x="${PL-8}" y="${YN(v)+4}" text-anchor="end" class="axis-tick">${v.toFixed(2)}</text>`; }
  const xLab = data.dates.map((d,i) => `<text x="${X(i)}" y="${HN-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" class="axis-tick">${d}</text>`).join("");
  const endPt = (arr,c) => { const y=YN(arr[n-1]); return `<circle cx="${X(n-1)}" cy="${y}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/><text x="${W-PR+8}" y="${y+4}" class="end-label">${arr[n-1].toFixed(3)}</text>`; };
  navHost.innerHTML = `<svg viewBox="0 0 ${W} ${HN}" style="width:100%;height:auto;display:block" id="portNavSvg">` +
    gridN + xLab +
    (portShowBm ? `<path d="${line(data.bm)}" fill="none" stroke="${C_BM}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>` : "") +
    `<path d="${line(data.nav)}" fill="none" stroke="${C_PORT}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    (portShowBm ? endPt(data.bm, C_BM) : "") + endPt(data.nav, C_PORT) +
    `<line id="portCrossV" y1="${PT}" y2="${HN-PB}" stroke="var(--vp-gray-300)" stroke-width="1" style="display:none"/>` +
    `<circle id="portCrossDot" r="4" fill="${C_PORT}" stroke="#fff" stroke-width="2" style="display:none"/>` +
    (portShowBm ? `<circle id="portCrossBm" r="4" fill="${C_BM}" stroke="#fff" stroke-width="2" style="display:none"/>` : "") +
    `<rect id="portNavHit" x="${PL}" y="${PT}" width="${iw}" height="${ihn}" fill="transparent"/>` +
    `</svg>`;

  // ---- 下 panel：指标（归一化相对位置）----
  const HI = 110, PTi = 8, PBi = 20, ihi = HI-PTi-PBi;
  const YI = t => PTi + ihi*(1-t);
  if (!indSeries.length) {
    indHost.innerHTML = `<div class="muted" style="text-align:center;padding:24px 0;border:1px dashed var(--vp-border);border-radius:8px;margin-top:4px">尚未选择指标 — 点右上角「选择指标」</div>`;
  } else {
    const single = indSeries.length===1;
    const first = indSeries[0];
    const fmtTick = t => single ? first.ind.fmt(first.lo+(first.hi-first.lo)*t) : Math.round(t*100)+"%";
    const gridI = [0,0.25,0.5,0.75,1].map(t =>
      `<line x1="${PL}" y1="${YI(t)}" x2="${W-PR}" y2="${YI(t)}" stroke="var(--vp-gray-100)" stroke-width="1"/>` +
      `<text x="${PL-8}" y="${YI(t)+4}" text-anchor="end" class="axis-tick">${fmtTick(t)}</text>`
    ).join("") + data.dates.map((d,i) => `<text x="${X(i)}" y="${HI-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" class="axis-tick">${d}</text>`).join("");
    const paths = indSeries.map(s =>
      `<path d="${s.pts.map((t,i)=>(i?'L':'M')+X(i).toFixed(1)+','+YI(t).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    ).join("");
    const dots = indSeries.map(s=>`<circle class="perf-ind-dot" data-id="${s.ind.id}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2" style="display:none"/>`).join("");
    indHost.innerHTML = `<svg viewBox="0 0 ${W} ${HI}" style="width:100%;height:auto;display:block" id="portIndSvg">` +
      gridI + paths +
      `<line id="portIndCross" y1="${PTi}" y2="${HI-PBi}" stroke="var(--vp-gray-300)" stroke-width="1" style="display:none"/>` + dots +
      `<rect id="portIndHit" x="${PL}" y="${PTi}" width="${iw}" height="${ihi}" fill="transparent" cursor="crosshair"/>` +
      `</svg>`;
  }

  // ---- 联动悬停：两 panel 十字线同步 + 合并 tooltip ----
  const crossV = wrap.querySelector("#portCrossV"), dot = wrap.querySelector("#portCrossDot"), dotBm = wrap.querySelector("#portCrossBm");
  const crossI = wrap.querySelector("#portIndCross");
  const iDots = [...wrap.querySelectorAll(".perf-ind-dot")];
  const onMove = e => {
    const wrapR = wrap.getBoundingClientRect();
    const xRatio = (e.clientX-wrapR.left)/wrapR.width*W;
    let idx = Math.round((xRatio-PL)/iw*(n-1));
    idx = Math.max(0,Math.min(n-1,idx));
    crossV.style.display=""; crossV.setAttribute("x1",X(idx)); crossV.setAttribute("x2",X(idx));
    if (crossI) { crossI.style.display=""; crossI.setAttribute("x1",X(idx)); crossI.setAttribute("x2",X(idx)); }
    dot.style.display=""; dot.setAttribute("cx",X(idx)); dot.setAttribute("cy",YN(data.nav[idx]));
    if (dotBm) { dotBm.style.display=""; dotBm.setAttribute("cx",X(idx)); dotBm.setAttribute("cy",YN(data.bm[idx])); }
    iDots.forEach(d => { const s=indSeries.find(x=>x.ind.id===d.dataset.id); d.style.display=""; d.setAttribute("cx",X(idx)); d.setAttribute("cy",YI(s.pts[idx])); });
    tip.textContent = "";
    const dEl = document.createElement("div"); dEl.className="tip-date"; dEl.textContent = dateLabel(idx);
    const row = (color,name,valHtml) => { const el=document.createElement("div"); el.innerHTML=`<i style="background:${color}"></i><span>${name}</span><b>${valHtml}</b>`; return el; };
    const ret = ((data.nav[idx]/data.nav[0])-1)*100;
    tip.append(dEl, row(C_PORT,"模拟组合", data.nav[idx].toFixed(3)+"（"+(ret>=0?"+":"")+ret.toFixed(1)+"%）"));
    if (portShowBm) tip.append(row(C_BM,"恒生指数", data.bm[idx].toFixed(3)));
    indSeries.forEach(s => tip.append(row(s.color, s.ind.name, s.ind.fmt(s.raw[idx]))));
    tip.style.display="";
    tip.style.left = Math.min(e.clientX-wrapR.left+14, wrapR.width-180)+"px";
    tip.style.top = Math.max(4, e.clientY-wrapR.top-40)+"px";
  };
  const onLeave = () => { [crossV,dot,dotBm,crossI,tip].forEach(el=>el&&(el.style.display="none")); iDots.forEach(d=>d.style.display="none"); };
  const hitN = wrap.querySelector("#portNavHit"), hitI = wrap.querySelector("#portIndHit");
  if (hitN) { hitN.addEventListener("pointermove", onMove); hitN.addEventListener("pointerleave", onLeave); }
  if (hitI) { hitI.addEventListener("pointermove", onMove); hitI.addEventListener("pointerleave", onLeave); }
}

    if (idxSortKey === 'weight') return b.weight - a.weight;

    return a.name.localeCompare(b.name, 'zh');
  });

  body.innerHTML = sorted.length === 0
    ? '<tr><td colspan="10" class="muted" style="text-align:center;padding:32px">该指数暂无演示数据</td></tr>'

      cum += s.weight;

        <td><input type="checkbox" ${idxSelected.has(s.code) ? 'checked' : ''} onchange="idxToggleSelect('${s.code}')"></td>

function idxDashGroups() { return [...new Set(IDX_TASKS.map(t => t.indexCode))]; }
function idxRangeStart() {
  const n = IDX_NAV_DATES.length;
  return idxDashRange === "1m" ? Math.max(0, n - 4) : idxDashRange === "3m" ? Math.max(0, n - 13) : 0;
}
// 任务净值对齐到全局日期轴：off 为任务起点在日期轴上的偏移
function idxTaskVals(t, s) {
  const out = []; const from = Math.max(s, t.off);
  for (let i = from; i < IDX_NAV_DATES.length; i++) {
    const p = i - t.off;
    if (p >= 0 && p < t.nav.length) out.push(t.nav[p]);
  }
  return { start: from, vals: out };
}
// 区间绩效：收益/波动/夏普/最大回撤；序列不足两点时返回 null
function idxPerf(vals) {
  if (!vals || vals.length < 2) return null;
  const ret = vals[vals.length - 1] / vals[0] - 1;
  const rets = vals.slice(1).map((v, i) => v / vals[i] - 1);
  const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
  const vol = Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, rets.length - 1)) * Math.sqrt(52);
  const ann = Math.pow(1 + ret, 52 / rets.length) - 1;
  let peak = -1e9, mdd = 0;
  vals.forEach(v => { peak = Math.max(peak, v); mdd = Math.min(mdd, v / peak - 1); });
  return { ret, vol, sharpe: vol > 0 ? ann / vol : null, mdd };
}
function fmtRet(v) { return v == null ? "—" : `${v >= 0 ? "+" : ""}${(v * 100).toFixed(1)}%`; }
function retCls(v) { return v == null ? "cell-muted" : v >= 0 ? "tag-up" : "tag-down"; }
