<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPBC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --vp-green: #20A06E;
      --vp-green-dark: #178A5C;
      --vp-green-light: #E8F5EE;
      --vp-lime: #BDD646;
      --vp-red: #B23A48;
      --vp-mint-50: #F2F8F4;
      --vp-white: #FFFFFF;
      --vp-gray-900: #1A1A1A;
      --vp-gray-700: #4A4A4A;
      --vp-gray-500: #737373;
      --vp-gray-300: #D1D5DB;
      --vp-gray-100: #F3F4F6;
      --vp-border: #E5E7EB;
      --vp-shadow: 0 1px 3px rgba(16, 94, 62, 0.08);
      --vp-radius: 6px;
      --vp-radius-sm: 4px;
      --sidebar-width: 220px;
      --topbar-height: 52px;
      --tabbar-height: 38px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--vp-mint-50);
      color: var(--vp-gray-900);
      font-size: 14px;
      height: 100vh;
      display: flex;
    }

    .sidebar { width: var(--sidebar-width); background-color: var(--vp-white); border-right: 1px solid var(--vp-border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-logo { height: var(--topbar-height); display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--vp-border); }
    .sidebar-logo-mark { width: 26px; height: 26px; background: linear-gradient(135deg, var(--vp-green) 0%, var(--vp-lime) 100%); border-radius: 5px; margin-right: 10px; }
    .sidebar-logo-text { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--vp-gray-900); }
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .menu-group { margin-bottom: 4px; }
    .menu-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 5px; font-size: 13px; color: var(--vp-gray-700); cursor: pointer; transition: background 0.15s, color 0.15s; user-select: none; }
    .menu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }
    .menu-item.active { background: var(--vp-green-light); color: var(--vp-green); font-weight: 600; }
    .menu-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .menu-item .arrow { margin-left: auto; font-size: 11px; color: var(--vp-gray-400); transition: transform 0.2s; }
    .menu-item.open .arrow { transform: rotate(180deg); }
    .submenu { padding-left: 32px; }
    .submenu-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px; color: var(--vp-gray-600); border-radius: 4px; cursor: pointer; transition: background 0.1s, color 0.1s; }
    .submenu-item:hover { background: var(--vp-green-light); color: var(--vp-green-dark); }
    .submenu-item.active { background: var(--vp-green-light); color: var(--vp-green); font-weight: 600; }
    .submenu-item .icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: var(--topbar-height); background-color: var(--vp-white); border-bottom: 1px solid var(--vp-border); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
    .topbar-breadcrumb { font-size: 13px; color: var(--vp-gray-500); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .user-chip { display: flex; align-items: center; gap: 8px; color: var(--vp-gray-600); font-size: 13px; }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--vp-green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .tabbar { background-color: var(--vp-white); border-bottom: 1px solid var(--vp-border); display: flex; align-items: stretch; height: var(--tabbar-height); padding: 0 16px; gap: 2px; flex-shrink: 0; overflow-x: auto; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: var(--vp-gray-500); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: color 0.15s; user-select: none; }
    .tab:hover { color: var(--vp-gray-700); }
    .tab.active { color: var(--vp-green); border-bottom-color: var(--vp-green); font-weight: 600; }
    .tab-close { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; color: var(--vp-gray-400); font-size: 14px; line-height: 1; }
    .tab-close:hover { background: var(--vp-gray-100); color: var(--vp-gray-700); }
    .content { flex: 1; overflow: auto; padding: 24px; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title { font-size: 24px; font-weight: 600; color: var(--vp-gray-900); }
    .page-subtitle { font-size: 13px; color: var(--vp-gray-500); margin-top: 2px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--vp-radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s ease; font-family: inherit; }
    .btn-primary { background-color: var(--vp-green); color: var(--vp-white); }
    .btn-primary:hover { background-color: var(--vp-green-dark); }
    .btn-secondary { background-color: var(--vp-white); color: var(--vp-gray-700); border: 1px solid var(--vp-border); }
    .btn-secondary:hover { border-color: var(--vp-green); color: var(--vp-green); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-ghost { background: transparent; color: var(--vp-gray); }
    .btn-ghost:hover { background: var(--vp-gray-100); }

    .card { background-color: var(--vp-white); border-radius: var(--vp-radius); box-shadow: var(--vp-shadow); border: 1px solid var(--vp-border); margin-bottom: 20px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--vp-border); }
    .card-title { font-size: 15px; font-weight: 600; color: var(--vp-gray-900); }
    .card-body { padding: 16px; }

    .filter-bar { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--vp-gray-700); }
    .form-control { height: 34px; padding: 0 12px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background-color: var(--vp-white); min-width: 140px; font-family: inherit; }
    .form-control:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }
    .filter-actions { display: flex; gap: 8px; margin-left: auto; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table thead th { background-color: var(--vp-gray-100); color: var(--vp-gray-700); font-weight: 600; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--vp-border); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .data-table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--vp-border); color: var(--vp-gray-900); vertical-align: middle; }
    .data-table tbody tr:hover { background-color: var(--vp-mint-50); }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .cell-code { font-family: 'SF Mono', Consolas, monospace; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--vp-green); }
    .cell-name { font-weight: 500; }
    .cell-muted { color: var(--vp-gray-500); }

    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .tag-green { background-color: var(--vp-green-light); color: var(--vp-green); }
    .tag-red { background-color: #FCE8EA; color: var(--vp-red); }
    .tag-gray { background-color: var(--vp-gray-100); color: var(--vp-gray-500); }
    .tag-blue { background-color: #E6F2FF; color: #2563EB; }

    .segmented { display: inline-flex; background: var(--vp-gray-100); border-radius: var(--vp-radius); padding: 3px; gap: 2px; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--vp-green); }
    .sort-icon { font-size: 11px; margin-left: 2px; }
    .seg { font-size: 12px; font-weight: 600; padding: 5px 12px; border: none; background: transparent; color: var(--vp-gray-700); border-radius: 4px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .seg:hover { color: var(--vp-green); }
    .seg.active { background: var(--vp-white); color: var(--vp-green); box-shadow: var(--vp-shadow); }

    .pagination-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--vp-border); }
    .pagination-info { font-size: 13px; color: var(--vp-gray-500); }
    .pagination { display: flex; gap: 4px; }
    .page-btn { min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--vp-border); background-color: var(--vp-white); color: var(--vp-gray-700); border-radius: var(--vp-radius-sm); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
    .page-btn:hover { border-color: var(--vp-green); color: var(--vp-green); }
    .page-btn.active { background-color: var(--vp-green); border-color: var(--vp-green); color: var(--vp-white); font-weight: 600; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .notice { background: var(--vp-gray-100); border: 1px solid var(--vp-border); border-radius: var(--vp-radius); padding: 10px 14px; font-size: 13px; color: var(--vp-gray-700); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .notice .ico { color: var(--vp-green); }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .muted { color: var(--vp-gray-500); }
    .tiny { font-size: 12px; color: var(--vp-gray-500); }
    .bold { font-weight: 600; }
    .right { text-align: right; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mt-4 { margin-top: 16px; }

    .chip-stack { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
    .ind-cell { white-space: nowrap; display: inline-block; }
    .industry-table-wrap { max-height: 320px; overflow-y: auto; }
    .import-record-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .import-record-actions { display: flex; align-items: center; gap: 8px; }
    .empty-state { padding: 16px; text-align: center; color: var(--vp-gray-500); background: var(--vp-gray-100); border-radius: var(--vp-radius); border: 1px dashed var(--vp-border); }

    /* Report modal */
    .modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    .modal-panel { position: relative; background: #fff; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--vp-border); }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--vp-gray-900); }
    .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--vp-border); }
    .form-row { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--vp-gray-700); margin-bottom: 6px; }
    .form-label.required::after { content: " *"; color: var(--vp-red); }
    .textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius); font-size: 14px; font-family: inherit; resize: vertical; }
    .textarea:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px rgba(32,160,110,0.1); }
    .stock-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--vp-mint-50); border: 1px solid var(--vp-border); border-radius: 6px; font-size: 13px; color: var(--vp-gray-900); }
    .filter-select { width: auto; flex: 0 1 auto; }
    .input { height: 34px; padding: 0 10px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background: var(--vp-white); font-family: inherit; }
    .input:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }
    .select { height: 34px; padding: 0 10px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background: var(--vp-white); font-family: inherit; }
    .select:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }

    /* Stock pool */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .kpi { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--vp-white); border: 1px solid var(--vp-border); border-radius: var(--vp-radius); }
    .kpi-icon { font-size: 24px; }
    .kpi-num { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 600; line-height: 1; }
    .kpi-label { font-size: 14px; color: var(--vp-gray-500); margin-top: 2px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card-pad { padding: 20px; }
    .card-hover { transition: border-color .15s, box-shadow .15s; cursor: pointer; }
    .card-hover:hover { border-color: var(--vp-green); box-shadow: var(--vp-shadow-md); }
    .tag-gold { background: rgba(199,162,82,0.15); color: #C7A252; }
    .tag-up { color: var(--vp-red); font-weight: 700; }
    .tag-down { color: var(--vp-green); font-weight: 700; }

    /* Portfolio */
    .weight-bar { width: 60px; height: 6px; background: var(--vp-gray-100); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .weight-fill { height: 100%; background: var(--vp-green); border-radius: 3px; }
    .list-scroll { max-height: 300px; overflow-y: auto; }
    .list-scroll::-webkit-scrollbar { width: 6px; }
    .list-scroll::-webkit-scrollbar-thumb { background: var(--vp-gray-300); border-radius: 3px; }
    .inline-detail { background: var(--vp-mint-50); border: 1px solid var(--vp-border); border-radius: 12px; padding: 4px 16px 16px; margin-top: 12px; }
    .inline-detail-divider { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; padding-top: 14px; border-top: 1px solid var(--vp-border); font-size: 14px; font-weight: 700; color: var(--vp-green-dark); }
    .inline-detail-divider span { font-size: 14px; font-weight: 700; color: var(--vp-green-dark); }
    .duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
    .duo-grid .card { margin-bottom: 0; min-width: 0; display: flex; flex-direction: column; }
    .duo-grid .card-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .duo-scroll { overflow: auto; flex: 1; max-height: 320px; }
    .duo-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .duo-scroll::-webkit-scrollbar-thumb { background: var(--vp-gray-300); border-radius: 3px; }
    .duo-grid .card { height: 360px; }
    .row-selected td { background: var(--vp-green-light) !important; }
    /* Chart */
    .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--vp-gray-500); margin-bottom: 6px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
    .chart-tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--vp-green-light); border-radius: 8px; box-shadow: 0 4px 14px rgba(21,50,43,.10); padding: 8px 10px; font-size: 12px; min-width: 130px; z-index: 30; }
    .chart-tip .tip-date { color: var(--vp-gray-500); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .chart-tip div:not(.tip-date) { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .chart-tip i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; flex: none; }
    .chart-tip span { color: var(--vp-gray-500); }
    .chart-tip b { margin-left: auto; color: var(--vp-gray-900); font-variant-numeric: tabular-nums; }
    .axis-tick { font-size: 11px; fill: var(--vp-gray-500); font-variant-numeric: tabular-nums; }
    .end-label { font-size: 12px; font-weight: 700; fill: var(--vp-gray-900); font-variant-numeric: tabular-nums; }
    /* Modal */
    .modal-mask { position: fixed; inset: 0; background: rgba(10,55,38,.32); display: none; align-items: center; justify-content: center; z-index: 500; }
    .modal-mask.show { display: flex; }
    .modal-mask .modal-overlay { position: absolute; inset: 0; background: transparent; }
    .modal-mask .modal { position: static; inset: auto; display: flex; flex-direction: column; max-width: 500px; width: 100%; margin: 0 auto; box-shadow: 0 12px 40px rgba(21,50,43,.18); border-radius: 12px; background: #fff; max-height: 86vh; }
    .modal-box { background: #fff; border-radius: 12px; width: 480px; max-width: 92vw; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(21,50,43,.18); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--vp-border); }
    .modal-body { padding: 16px 18px; overflow: auto; flex: 1; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--vp-border); }
    .flex1 { flex: 1; }
    /* Indicator pick */
    .pick-list { max-height: 300px; overflow: auto; border: 1px solid var(--vp-border); border-radius: 8px; }
    .pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--vp-border); cursor: pointer; }
    .pick-item:last-child { border-bottom: none; }
    .pick-item:hover { background: var(--vp-green-light); }
    .pick-item input { accent-color: var(--vp-green); }
    .ind-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .ind-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--vp-green-light); border: 1px solid var(--vp-border); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; font-weight: 600; }
    .ind-chip i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; }
    .ind-chip button { border: none; background: transparent; cursor: pointer; color: var(--vp-gray-500); width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
    .ind-chip button:hover { background: var(--vp-gray-100); color: var(--vp-red); }
    .ind-key { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; }

    /* Config */
    .perm-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--vp-border); font-size: 14px; font-weight: 600; color: var(--vp-gray-900); }
    .perm-row input { width: 16px; height: 16px; accent-color: var(--vp-green); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Product Center - Share Class */
    .share-class-modal .modal { max-width: 980px; }
    .sc-tabs { display: flex; border-bottom: 1px solid var(--vp-border); background: var(--vp-gray-100); padding: 0 20px; position: sticky; top: 0; z-index: 10; }
    .sc-tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--vp-gray-500); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .sc-tab:hover { color: var(--vp-green); }
    .sc-tab.active { color: var(--vp-green); border-bottom-color: var(--vp-green); background: var(--vp-white); }
    .sc-panel { display: none; padding: 20px; }
    .sc-panel.active { display: block; }
    .sc-section-title { font-size: 13px; font-weight: 700; color: var(--vp-gray-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--vp-border); }
    .sc-form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .sc-form-group { display: flex; flex-direction: column; gap: 5px; }
    .sc-form-group.span-2 { grid-column: span 2; }
    .sc-form-group.span-3 { grid-column: span 3; }
    .sc-form-label { font-size: 12px; font-weight: 600; color: var(--vp-gray-700); }
    .sc-form-label .req { color: var(--vp-red); margin-left: 2px; }
    .sc-input { height: 36px; padding: 0 12px; border: 1px solid var(--vp-border); border-radius: var(--vp-radius-sm); font-size: 13px; color: var(--vp-gray-900); background: var(--vp-white); font-family: inherit; width: 100%; }
    .sc-input:focus { outline: none; border-color: var(--vp-green); box-shadow: 0 0 0 3px var(--vp-green-light); }
    .sc-input:disabled { background: var(--vp-gray-100); color: var(--vp-gray-500); }
    textarea.sc-input { height: auto; min-height: 70px; resize: vertical; }

const openTabs = {};
let activeTabKey = null;

function openTab(key, title) {
  if (openTabs[key]) { activateTab(key); return; }
  openTabs[key] = { title, content: buildContent(key) };
  renderTabBar();
  activateTab(key);
  updateSidebarActive(key);
}

function closeTab(key, event) {
  event.stopPropagation();
  delete openTabs[key];
  renderTabBar();
  if (activeTabKey === key) {
    const keys = Object.keys(openTabs);
    activeTabKey = keys.length > 0 ? keys[keys.length - 1] : null;
    if (activeTabKey) activateTab(activeTabKey);
    else { renderContent(''); updateBreadcrumb(''); }
  }
}

function activateTab(key) {
  activeTabKey = key;
  renderTabBar();
  renderContent(openTabs[key].content);
  updateBreadcrumb(openTabs[key].title);
}

function renderTabBar() {
  const bar = document.getElementById('tabbar');
  bar.innerHTML = Object.keys(openTabs).map(key => {
    const isActive = key === activeTabKey;
    return `<div class="tab ${isActive ? 'active' : ''}" onclick="activateTab('${key}')">${openTabs[key].title}<span class="tab-close" onclick="closeTab('${key}', event)">×</span></div>`;
  }).join('');
}

function renderContent(html) {
  document.getElementById('content').innerHTML = html;
  if (activeTabKey === 'industry') { indInitFilters(); indRenderUnified(); }
  if (activeTabKey === 'research-report') { reportRender(); }
  if (activeTabKey === 'stock-pool') { poolRenderGrid(); poolRenderDetail(); }
  if (activeTabKey === 'portfolio') { portRenderPortfolios(); portRenderShared(); portRenderHoldings(); portRenderRebalances(); portRenderIndicatorLib(); portRenderNavChart(); }
  if (activeTabKey === 'config') { cfgSwitchTab('users'); }
  if (activeTabKey === 'share-class') { scRender(); }
  if (activeTabKey === 'fee') { feeRender(); }
}
function updateBreadcrumb(text) { document.getElementById('topbarBreadcrumb').textContent = text; }

function toggleSubmenu(id) {
  const sub = document.getElementById('submenu-' + id);
  const item = document.getElementById('menu-' + id);
  sub.classList.toggle('open');
  item.classList.toggle('open');
}

function updateSidebarActive(key) {
  document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
  const map = { 'industry':'industry', 'research-report':'research-report', 'stock-pool':'stock-pool', 'portfolio':'portfolio', 'config':'config', 'product-management':'product-management', 'share-class':'share-class' };
  if (key && map[key]) {

      if (item.getAttribute('onclick') && item.getAttribute('onclick').startsWith(`openTab('${map[key]}'`)) item.classList.add('active');
    });
  }
}

let indCurrentMarket = "ALL";

let indCurrentIndustryName = "";

function indViewLabel() { return indCurrentMarket === "ALL" ? "全部市场" : IND_DATA[indCurrentMarket].name; }

function indGetIndustries() {
  if (indCurrentMarket !== "ALL") return IND_DATA[indCurrentMarket].industries.map(i => ({ ...i, marketNames: [IND_DATA[indCurrentMarket].name] }));
  const grouped = new Map();
  Object.entries(IND_DATA).forEach(([mc, market]) => {
    market.industries.forEach(ind => {
      if (!grouped.has(ind.name)) grouped.set(ind.name, { ...ind, marketNames: [market.name], analysts: [...ind.analysts] });
      else {
        const m = grouped.get(ind.name);
        m.marketNames = [...new Set([...m.marketNames, market.name])];
        const seen = new Set(m.analysts.map(a => a.id));
        ind.analysts.forEach(a => { if (!seen.has(a.id)) { m.analysts.push(a); seen.add(a.id); } });
      }
    });
  });
  return Array.from(grouped.values());
}

function indRenderUnified() {
  const body = document.getElementById("indUniBody");
  if (!body) return;
  let rows = indGetIndustries();

  // Apply dropdown filters
  const fMarket = document.getElementById("indFMarket")?.value || "";
  const fIndustry = document.getElementById("indFIndustry")?.value || "";
  const fAnalyst = document.getElementById("indFAnalyst")?.value || "";
  if (fMarket) rows = rows.filter(r => (r.marketNames || []).includes(IND_DATA[fMarket]?.name));
  if (fIndustry) rows = rows.filter(r => r.name === fIndustry);
  if (fAnalyst) rows = rows.filter(r => (r.analysts || []).filter(a => a.status === "在职").some(a => a.name === fAnalyst));

  // Attach computed fields
  rows = rows.map((ind, i) => {
    const analysts = (ind.analysts || []).filter(a => a.status === "在职");
    return {
      ...ind,
      _analystNames: analysts.length ? analysts.map(a => a.name).join("、") : "—",
      _updater: analysts.length ? analysts[0].name : "—",
      _time: ind._time || ["2026/08/20 09:15:32","2026/08/18 14:22:07","2026/08/15 11:03:45","2026/08/12 16:40:18","2026/08/10 08:55:01","2026/08/08 10:30:44","2026/08/05 13:20:11","2026/08/03 15:07:38","2026/08/01 09:42:56","2026/07/30 17:18:22","2026/07/28 11:05:33"][i % 11]
    };
  });

  // Sort
  if (indSortField) {
    rows.sort((a, b) => {
      let av, bv;
      if (indSortField === "name")    { av = a.name; bv = b.name; }
      else if (indSortField === "market")  { av = (a.marketNames || []).join(""); bv = (b.marketNames || []).join(""); }
      else if (indSortField === "analyst") { av = a._analystNames; bv = b._analystNames; }
      else if (indSortField === "updater") { av = a._updater; bv = b._updater; }
      else if (indSortField === "time")    { av = a._time; bv = b._time; }
      if (av < bv) return indSortDir === "asc" ? -1 : 1;
      if (av > bv) return indSortDir === "asc" ? 1 : -1;
      return 0;
    });
  }

  // Update sort icons
  ["name","market","analyst","updater","time"].forEach(f => {
    const el = document.getElementById("sort-" + f);
    if (el) el.textContent = f === indSortField ? (indSortDir === "asc" ? "↑" : "↓") : "";
  });

  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;padding:32px">暂无数据</td></tr>'; return; }
  body.innerHTML = rows.map(ind => {
    const hasStocks = ind.stocks && ind.stocks.length > 0;
    const nameHtml = hasStocks
      ? `<span style="text-decoration:underline;cursor:pointer;color:var(--vp-green)" onclick="indShowStocks('${ind.name}')">${ind.name}</span>`
      : ind.name;
    return `<tr>
      <td class="bold">${nameHtml}</td>
      <td>${(ind.marketNames || []).join("、")}</td>
      <td>${ind._analystNames}</td>
      <td class="muted">${ind._updater}</td>
      <td class="muted" style="font-variant-numeric:tabular-nums">${ind._time}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="indOpenImport('${ind.name}')">导入</button>
        <button class="btn btn-ghost btn-sm" onclick="alert('编辑「${ind.name}」')">编辑</button>
      </td>
    </tr>`;
  }).join("");
}

let indSortField = "";
let indSortDir = "asc";

function indSort(field) {
  if (indSortField === field) indSortDir = indSortDir === "asc" ? "desc" : "asc";
  else { indSortField = field; indSortDir = "asc"; }
  indRenderUnified();
}

// Show stock panel below the table when clicking an industry name
function indShowStocks(name) {
  const panel = document.getElementById("indStockPanel");
  const title = document.getElementById("indStockTitle");
  const tbody = document.getElementById("indStockBody");
  if (!panel || !title || !tbody) return;
  // Collect all stocks from ALL markets that have this industry name
  const marketMap = { "HK":"港股","US":"美股","JP":"日股","KR":"韩股" };
  const allStocks = [];
  Object.entries(IND_DATA).forEach(([mcode, market]) => {
    const ind = market.industries.find(i => i.name === name);
    if (ind && ind.stocks && ind.stocks.length) {
      ind.stocks.forEach(s => allStocks.push({ ...s, _market: marketMap[mcode] || mcode }));
    }
  });
  title.textContent = name + " — 股票明细";
  if (!allStocks.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">暂无股票数据，请先上传</td></tr>';
  } else {
    tbody.innerHTML = allStocks.map(s => {
      return `<tr>
        <td>${s._market}</td>
        <td><span class="cell-code">${s.code}</span></td>
        <td>${s.name}</td>
        <td class="muted">${s.issuer || "—"}</td>
      </tr>`;
    }).join("");
  }
  panel.style.display = "block";
}

      ind.stocks.forEach(s => allStocks.push({ ...s, _market: marketMap[mcode] || mcode }));

function reportRender() {

  const company = document.getElementById("searchCompany")?.value.trim().toLowerCase() || "";

  const rating = document.getElementById("filterRating")?.value || "";

  const filtered = REPORTS.filter(r => {
    const matchStock = !stock || (r.stock || "—").toLowerCase().includes(stock);
    const matchCompany = !company || (r.company || "—").toLowerCase().includes(company);
    const matchCreator = !creator || (r.creator || "").toLowerCase().includes(creator);
    const matchMarket = !market || r.market.includes(market);
    const matchIndustry = !industry || r.industry === industry;
    const matchRating = !rating || r.rating === rating;
    const matchStatus = !status || (status === "已发布" ? r.attachment : !r.attachment);
    return matchStock && matchCompany && matchCreator && matchMarket && matchIndustry && matchRating && matchStatus;
  });

  body.innerHTML = filtered.length === 0
    ? '<tr><td colspan="8" class="muted" style="text-align:center;padding:32px">暂无符合筛选条件的研报</td></tr>'

function reportValidate() {
  const code = document.getElementById("stockCodeInput")?.value.trim();
  const pattern = /(?:\d{5,6}\.(?:HK|US|SH|SZ|CN)|[A-Za-z0-9]+\.(?:HK|US|SH|SZ|CN))/i;
  if (!code) { alert("股票代码为必填项，且必须包含市场后缀，如：00700.HK、NVDA.US"); return false; }
  if (!pattern.test(code)) { alert("股票代码必须带市场后缀，例如 00700.HK / NVDA.US / 600519.SH"); return false; }
  alert("原型：已校验通过，准备发布研报");
  reportCloseEditor();
  return true;
}

function cfgRenderPerms() {
  const grid = document.getElementById("cfgPermGrid");
  if (!grid) return;
  const col = cfgCurRole;
  grid.innerHTML = CFG_PERMS.reduce((acc, p) => {

      <span>${p.key}</span>

function cfgSwitchTab(tab) {
  document.querySelectorAll("#cfgSubTab .seg").forEach(b => b.classList.remove("active"));
  document.querySelector(`#cfgSubTab .seg[onclick="cfgSwitchTab('${tab}')"]`).classList.add("active");
  document.getElementById("cfgPaneUsers").style.display = tab === "users" ? "" : "none";
  document.getElementById("cfgPaneRoles").style.display = tab === "roles" ? "" : "none";
  document.getElementById("cfgPaneOptions").style.display = tab === "options" ? "" : "none";
  if (tab === "users") cfgRenderUsers();
  if (tab === "roles") { cfgRenderRoles(); cfgRenderPerms(); }
  if (tab === "options") { cfgRenderOptSets(); cfgRenderOptItems(); }
}

function portIndTimeLabels() {
  if (portIndRange === "1Y") return ["12月前","10月前","8月前","6月前","4月前","2月前","当前"];
  if (portIndRange === "3Y") return ["36月前","30月前","24月前","18月前","12月前","6月前","当前"];
  if (portIndRange === "CUS") {
    const fmt = s => s.slice(2).replace(/^0/,"");
    return [fmt(portIndDateFrom), "区间中点", fmt(portIndDateTo)];
  }
  return ["6月前","5月前","4月前","3月前","2月前","1月前","当前"];
}

function portIndSeries(ind) {
  const n = portIndTimeLabels().length;
  const anchors = [ind.m6, ind.m3, ind.m1, ind.value];
  const out = [];
  for (let i = 0; i < n; i++) {
    const pos = i / (n - 1) * (anchors.length - 1);
    const k = Math.min(Math.floor(pos), anchors.length - 2);
    out.push(anchors[k] + (anchors[k + 1] - anchors[k]) * (pos - k));
  }
  return out;
}

function portRenderIndChart() {
  document.querySelectorAll("#portIndRangeSeg .seg").forEach(b => {
    b.classList.toggle("active", b.dataset.ir === portIndRange);
    b.onclick = () => { portIndRange = b.dataset.ir; document.getElementById("portIndCustomRange").style.display = portIndRange==="CUS"?"":"none"; portRenderIndChart(); };
  });
  const crEl = document.getElementById("portIndCustomRange");
  if (crEl) crEl.style.display = portIndRange==="CUS"?"":"none";
  const host = document.getElementById("portIndChart");
  if (!host) return;
  const picked = Object.values(IND_POOL).flat().filter(i => i.picked);
  if (!picked.length) { host.innerHTML = `<div class="muted" style="text-align:center;padding:28px 0">尚未选择指标 — 点右上角「选择指标」</div>`; return; }
  const labels = portIndTimeLabels();
  const n = labels.length;
  const W = 760, H = 150, PL = 46, PR = 20, PT = 10, PB = 22;
  const iw = W-PL-PR, ih = H-PT-PB;
  const seriesMap = new Map();
  picked.slice(0,8).forEach((ind,k) => {
    const vals = portIndSeries(ind);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi-lo)*0.15||Math.abs(hi)*0.02||0.1;
    lo-=pad; hi+=pad;
    seriesMap.set(ind.id, { pts: vals.map(v=>(v-lo)/(hi-lo)), raw: vals, color: IND_COLORS[k%IND_COLORS.length], ind, lo, hi });
  });
  const X = i => PL + iw*i/(n-1);
  const Y = t => PT + ih*(1-t);
  const single = seriesMap.size===1;
  const first = [...seriesMap.values()][0];
  const fmtTick = t => single ? first.ind.fmt(first.lo+(first.hi-first.lo)*t) : Math.round(t*100)+"%";
  const yTicks = [0,0.25,0.5,0.75,1];
  const grid = yTicks.map(t =>

    `</svg><div id="portIndTip" class="chart-tip" style="display:none"></div>` +

  const svg = host.querySelector("#portIndSvg"), hit = host.querySelector("#portIndHit");
  const cross = host.querySelector("#portIndCross"), tip = host.querySelector("#portIndTip");
  const dots = [...host.querySelectorAll(".ind-dot")];
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const xRatio = (e.clientX-r.left)/r.width*W;
    let idx = Math.round((xRatio-PL)/iw*(n-1));
    idx = Math.max(0,Math.min(n-1,idx));
    cross.style.display = ""; cross.setAttribute("x1",X(idx)); cross.setAttribute("x2",X(idx));
    dots.forEach(d => { const s=seriesMap.get(d.dataset.id); d.style.display=""; d.setAttribute("cx",X(idx)); d.setAttribute("cy",Y(s.pts[idx])); });
    tip.textContent = "";
    const de = document.createElement("div"); de.className="tip-date"; de.textContent = labels[idx]==="当前"?"当前（"+portIndDateTo+"）":labels[idx];
    tip.append(de);
    [...seriesMap.values()].forEach(s => {

      tip.append(row);
    });
    tip.style.display = "";
    const hostR = host.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX-hostR.left+14, hostR.width-170)+"px";
    tip.style.top = Math.max(4, e.clientY-hostR.top-60)+"px";

function portRenderNavChart() {
  const host = document.getElementById("portNavChart");
  if (!host) return;
  const data = NAV_SERIES[portCurRange];
  const W = 760, H = 120, PL = 44, PR = 56, PT = 8, PB = 20;
  const iw = W-PL-PR, ih = H-PT-PB;
  const all = portShowBm ? data.nav.concat(data.bm) : data.nav;
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi-lo)*0.08||0.01; lo-=pad; hi+=pad;
  const X = i => PL + iw*i/(data.dates.length-1);
  const Y = v => PT + ih*(1-(v-lo)/(hi-lo));
  const line = arr => arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const ticks = 4, tickVals = [];
  for (let t=0;t<=ticks;t++) tickVals.push(lo+(hi-lo)*t/ticks);
  const grid = tickVals.map(v =>
    `<line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}" stroke="var(--vp-gray-100)" stroke-width="1"/>` +
    `<text x="${PL-8}" y="${Y(v)+4}" text-anchor="end" class="axis-tick">${v.toFixed(2)}</text>`
  ).join("") + data.dates.map((d,i) =>
    `<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===data.dates.length-1?'end':'middle'}" class="axis-tick">${d}</text>`
  ).join("");
  const xLabels = data.dates.map((d,i) =>
    `<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===data.dates.length-1?'end':'middle'}" class="axis-tick">${d}</text>`
  ).join("");
  const C_PORT="var(--vp-green)", C_BM="var(--vp-red)";
  const bm = portShowBm ? `<path d="${line(data.bm)}" fill="none" stroke="${C_BM}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>` : "";
  const port = `<path d="${line(data.nav)}" fill="none" stroke="${C_PORT}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const endY = Y(data.nav[data.nav.length-1]);
  const endLabel = `<circle cx="${X(data.nav.length-1)}" cy="${endY}" r="4" fill="${C_PORT}" stroke="#fff" stroke-width="2"/>` +
    `<text x="${W-PR+8}" y="${endY+4}" class="end-label">${data.nav[data.nav.length-1].toFixed(3)}</text>`;
  let bmEnd = "";
  if (portShowBm) { const by=Y(data.bm[data.bm.length-1]); bmEnd = `<circle cx="${X(data.bm.length-1)}" cy="${by}" r="4" fill="${C_BM}" stroke="#fff" stroke-width="2"/>` + `<text x="${W-PR+8}" y="${by+4}" class="end-label">${data.bm[data.bm.length-1].toFixed(3)}</text>`; }
  const legend = portShowBm ? `<div class="chart-legend"><span><i style="background:${C_PORT}"></i>模拟组合</span><span><i style="background:${C_BM}"></i>恒生指数</span></div>` : "";
  host.innerHTML = legend + `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" id="portNavSvg">` +
    grid + xLabels + bm + port + endLabel + bmEnd +
    `<line id="portCrossV" y1="${PT}" y2="${H-PB}" stroke="var(--vp-gray-300)" stroke-width="1" style="display:none"/>` +
    `<circle id="portCrossDot" r="4" fill="${C_PORT}" stroke="#fff" stroke-width="2" style="display:none"/>` +
    (portShowBm?`<circle id="portCrossBm" r="4" fill="${C_BM}" stroke="#fff" stroke-width="2" style="display:none"/>`:"") +
    `<rect id="portNavHit" x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent"/>` +
    `</svg><div id="portChartTip" class="chart-tip" style="display:none"></div><div class="tiny muted" style="margin-top:6px">区间起始净值归一为 1.00 · 悬停查看各日期数值</div>`;
  const svg = host.querySelector("#portNavSvg"), hit = host.querySelector("#portNavHit");
  const crossV = host.querySelector("#portCrossV"), dot = host.querySelector("#portCrossDot"), dotBm = host.querySelector("#portCrossBm"), tip = host.querySelector("#portChartTip");
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const xRatio = (e.clientX-r.left)/r.width*W;
    let idx = Math.round((xRatio-PL)/iw*(data.dates.length-1));
    idx = Math.max(0,Math.min(data.dates.length-1,idx));
    crossV.style.display=""; crossV.setAttribute("x1",X(idx)); crossV.setAttribute("x2",X(idx));
    dot.style.display=""; dot.setAttribute("cx",X(idx)); dot.setAttribute("cy",Y(data.nav[idx]));
    if (dotBm) { dotBm.style.display=""; dotBm.setAttribute("cx",X(idx)); dotBm.setAttribute("cy",Y(data.bm[idx])); }
    const ret = ((data.nav[idx]/data.nav[0])-1)*100;
    tip.textContent = "";
    const d = document.createElement("div"); d.className="tip-date"; d.textContent = (portCurRange==="1Y"||portCurRange==="MAX"?"":"2026-")+data.dates[idx];
    const row = (color,name,v) => { const el=document.createElement("div"); el.innerHTML=`<i style="background:${color}"></i><span>${name}</span><b>${name==="模拟组合"?v.toFixed(3)+"（"+(ret>=0?"+":"")+ret.toFixed(1)+"%）":v.toFixed(3)}</b>`; return el; };
    tip.append(d, row(C_PORT,"模拟组合",data.nav[idx]));
    if (portShowBm) tip.append(row(C_BM,"恒生指数",data.bm[idx]));
    tip.style.display="";
    const hostR = host.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX-hostR.left+14, hostR.width-160)+"px";
    tip.style.top = Math.max(4, e.clientY-hostR.top-10)+"px";
  });
  hit.addEventListener("pointerleave", () => { [crossV,dot,dotBm,tip].forEach(el=>el&&(el.style.display="none")); });
  document.querySelectorAll("#portRangeSeg .seg").forEach(b => {
    b.classList.toggle("active", b.dataset.range === portCurRange);
    b.onclick = () => { portCurRange = b.dataset.range; portRenderNavChart(); };
  });
  const bmEl = document.getElementById("portBmToggle"); if (bmEl) bmEl.onchange = e => { portShowBm = e.target.checked; portRenderNavChart(); };
}

                <button class="btn btn-ghost btn-sm" onclick="alert('原型：按日期筛选')">📅 筛选</button>
                <button class="btn btn-primary btn-sm" onclick="portOpenRebalance()">⚙️ 发起调仓</button>
              </div>
            </div>
            <div class="card-body" style="padding:0"><div class="duo-scroll"><table class="data-table"><thead><tr><th>调仓日期</th><th>类型</th><th>标的</th><th class="cell-muted">变动</th><th class="cell-muted">成交价</th><th class="cell-muted">金额</th><th class="cell-muted">调仓后权重</th><th>操作人</th><th>备注</th></tr></thead><tbody id="portRebalanceBody"></tbody></table></div></div>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-head">
            <div class="flex items-center gap-3">
              <div class="card-title">指标库</div>
              <span class="tiny" id="portIndPicked"></span>
            </div>
            <div class="flex gap-2">
              <input class="input" placeholder="搜索指标..." style="width:140px" id="portIndSearch" oninput="portRenderIndicatorLib()">
              <button class="btn btn-primary btn-sm" onclick="portOpenIndicatorPick()">＋ 选择指标</button>
            </div>
          </div>
          <div class="card-body">
            <div class="ind-chips" id="portIndChips"></div>
            <div class="flex items-center gap-3 flex-wrap mb-3">
              <div class="segmented" id="portIndRangeSeg">
                <button class="seg active" data-ir="6M">近6月</button>
                <button class="seg" data-ir="1Y">近1年</button>
                <button class="seg" data-ir="3Y">近3年</button>
                <button class="seg" data-ir="CUS">自定义</button>
              </div>
              <div id="portIndCustomRange" style="display:none" class="flex items-center gap-2">
                <input class="input" type="date" id="portIndDateFrom" value="2026-02-15" style="width:140px">
                <span class="tiny">至</span>
                <input class="input" type="date" id="portIndDateTo" value="2026-08-15" style="width:140px">
                <button class="btn btn-secondary btn-sm" onclick="portApplyCustomRange()">应用</button>
              </div>
            </div>
            <div id="portIndChart"></div>
          </div>
          <div class="card-body" style="padding:0;border-top:1px solid var(--vp-border)">
            <table class="data-table"><thead><tr><th></th><th>指标名称</th><th>口径</th><th class="cell-muted">当前值</th><th class="cell-muted">1月前</th><th class="cell-muted">3月前</th><th class="cell-muted">6月前</th><th class="right">操作</th></tr></thead><tbody id="portIndBody"></tbody></table>
          </div>
        </div>

        <div class="notice mt-4"><span class="ico">ⓘ</span>组合为<strong>虚拟模拟盘</strong>，不涉及真实交易。涨跌色采用<strong>港式惯例</strong>：上涨=#B23A48，下跌=#20A06E。</div>
      </div>
    </div>

    <!-- 调仓弹窗 -->
    <div class="modal-mask" id="portRebalanceModal">
      <div class="modal-box">
        <div class="modal-head"><div class="card-title">发起调仓 · 港股大消费模拟盘</div><button class="btn btn-ghost btn-sm" onclick="portCloseRebalance()">✕</button></div>
        <div class="modal-body">
          <div class="flex gap-3 mb-3">
            <div><div class="tiny mb-2">调仓日期</div><input class="input" type="date" value="2026-08-15"></div>
            <div><div class="tiny mb-2">类型</div><select class="select" id="portRbType" onchange="portRenderRbForm()"><option value="buy">买入</option><option value="sell">卖出</option><option value="weight">权重调整</option></select></div>
          </div>
          <div id="portRbForm"></div>
          <div class="tiny" style="margin-top:10px;color:var(--vp-gray-500)">说明：模拟盘调仓即时生效，按当日收盘价虚拟成交；调仓后自动重算组合净值曲线。</div>
        </div>
        <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="portCloseRebalance()">取消</button><button class="btn btn-primary btn-sm" onclick="portCloseRebalance();alert('原型：调仓已提交，净值曲线与持仓已重算')">确认调仓</button></div>
      </div>
    </div>

    <!-- 指标选择弹窗 -->
    <div class="modal-mask" id="portIndModal">
      <div class="modal-box" style="max-width:520px">
        <div class="modal-head"><div class="card-title">选择要观察的指标</div><button class="btn btn-ghost btn-sm" onclick="portCloseIndicatorPick()">✕</button></div>
        <div class="modal-body">
          <div class="segmented mb-3" id="portIndCatSeg"></div>
          <div id="portPickList" class="pick-list"></div>
          <div class="tiny" style="margin-top:10px;color:var(--vp-gray-500)">勾选后指标进入上方「指标库」表格，按当前区间口径计算。</div>
        </div>
        <div class="modal-foot"><button class="btn btn-ghost btn-sm" onclick="portCloseIndicatorPick()">取消</button><button class="btn btn-primary btn-sm" onclick="portApplyIndicatorPick()">应用（<span id="portPickCount">0</span> 项）</button></div>
      </div>
    </div>

    <!-- 新建组合弹窗 -->
    <div id="portCreateModal" style="position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(10,55,38,.32)">
      <div style="background:#fff;border-radius:12px;width:540px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--vp-border)">
          <div style="font-weight:600;font-size:15px">新建组合</div>
          <button class="btn btn-ghost btn-sm" onclick="portCloseCreate()">✕</button>
        </div>
        <div style="padding:16px 18px;overflow:auto;flex:1">
          <div class="form-row"><label class="form-label required">组合名称</label><input id="portCreateName" class="input" style="width:100%" placeholder="如：港股大消费模拟盘"><div id="portCreateNameTip" class="form-tip" style="color:var(--vp-red);display:none">组合名称已存在，请换一个</div></div>
          <div class="form-row"><label class="form-label">投资策略</label><textarea id="portCreateStrategy" class="textarea" style="width:100%;height:80px" placeholder="简述投资策略，如：专注港股大消费赛道，配置高股息龙头"></textarea></div>
          <div class="form-row"><label class="form-label required">业绩基准</label><input id="portCreateBenchmark" class="input" style="width:100%" placeholder="如：恒生指数、沪深300"></div>
          <div class="form-row"><label class="form-label required">初始资金</label><input id="portCreateCapital" class="input" style="width:100%" placeholder="如：1000万"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--vp-border)"><button class="btn btn-ghost btn-sm" onclick="portCloseCreate()">取消</button><button class="btn btn-primary btn-sm" onclick="portDoCreate()">创建</button></div>
      </div>
    </div>`;
}

function portSwitchTab(tab) {
  document.querySelectorAll("#portMainTab .seg").forEach(b => b.classList.remove("active"));
  document.querySelector(`#portMainTab .seg[onclick="portSwitchTab('${tab}')"]`).classList.add("active");
  document.getElementById("portPaneMine").style.display = tab === "mine" ? "" : "none";
  document.getElementById("portPaneShared").style.display = tab === "shared" ? "" : "none";
  if (tab === "shared") portRenderShared();
}

function portOpenCreate() {
  document.getElementById("portCreateName").value = "";
  document.getElementById("portCreateStrategy").value = "";
  document.getElementById("portCreateBenchmark").value = "";
  document.getElementById("portCreateCapital").value = "";
  document.getElementById("portCreateNameTip").style.display = "none";
  document.getElementById("portCreateName").classList.remove("error");
  document.getElementById("portCreateModal").style.display = "flex";
}

function portCloseCreate() {
  document.getElementById("portCreateModal").style.display = "none";
}

function portDoCreate() {
  const name = document.getElementById("portCreateName").value.trim();
  const benchmark = document.getElementById("portCreateBenchmark").value.trim();
  const capital = document.getElementById("portCreateCapital").value.trim();
  const nameInput = document.getElementById("portCreateName");
  const nameTip = document.getElementById("portCreateNameTip");
  // 校验组合名称不能重复
  if (PORTFOLIOS.some(p => p.name === name)) {
    nameInput.classList.add("error");
    nameTip.style.display = "";
    return;
  }
  // 必填校验
  if (!name) { nameInput.classList.add("error"); return; }
  if (!benchmark) { document.getElementById("portCreateBenchmark").classList.add("error"); return; }
  if (!capital) { document.getElementById("portCreateCapital").classList.add("error"); return; }
  // 创建新组合
  const newId = "P" + String(PORTFOLIOS.length + 1).padStart(3, "0");
  PORTFOLIOS.unshift({ id: newId, name, holdings:0, weight:"—", capital, creator:"当前用户", share:"私人", shareType:"—", status:"启用", _strategy: document.getElementById("portCreateStrategy").value.trim(), _benchmark: benchmark });
  portCloseCreate();
  portRenderPortfolios();
}


// ========== Init ==========
document.addEventListener('DOMContentLoaded', function() {
  openTab('industry', '行业配置');
});
</script>
</body>
</html>
